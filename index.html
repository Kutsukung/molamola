      <td class="num hide-m">${nf(act.reduce((s, r) => s + r.itemCount, 0))}</td>
      <td class="num hide-m">${money(act.reduce((s, r) => s + r.sub, 0))}</td>
      <td class="num hide-m">${money(act.reduce((s, r) => s + r.discount, 0))}</td>
      <td class="num">${money(act.reduce((s, r) => s + r.total, 0))}</td><td class="hide-m" colspan="2"></td></tr></tfoot>
  </table>`;
  $$('tr.click', box).forEach(tr => { tr.onclick = () => openReceiveDetail(tr.dataset.id); });
  makeSortable(box, srt, () => fillReceiveList(orig));
}

async function startReceive(rid, preloaded) {
  let d = preloaded || null;
  try {
    const jobs = [ensureCtx('receive')];
    if (rid && !d) jobs.push(api('getReceiveDetail', S.token, rid).then(x => { d = x; }));
    await Promise.all(jobs);
  } catch (e) { fail(e); return; }
  S.draftOwner = S.user.id;
  if (d) {
    S.recv = {
      mode: 'edit', receiveId: d.receiveId, vendor: d.vendor, docType: d.docType, note: d.note,
      discount: d.discount, savedDate: d.date, date: null, owner: d.userName,
      lines: d.lines.map(l => newRLine({
        lotId: l.lotId, productId: l.productId, name: l.name, recvUnit: l.packUnit,
        packQty: l.packQty, packCost: l.packCost,
        qty: l.qty, qtyTouched: true, mfgLot: l.mfgLot, sold: l.sold
      })),
      payment: { status: d.paymentStatus, wallet: d.wallet || 'CASH', claimUserId: d.claimUserId },
      buy: { keep: d.purchaseFiles.slice(), add: [] },
      pay: { keep: d.paymentFiles.slice(), add: [] }
    };
  } else {
    S.recv = {
      mode: 'new', receiveId: '', vendor: '', docType: null, note: '', discount: 0, date: null,
      lines: [newRLine()], payment: { status: 'UNPAID', wallet: 'CASH', claimUserId: '' },
      buy: { keep: [], add: [] }, pay: { keep: [], add: [] }
    };
  }
  renderReceive($('#view'), S.seq);
}

function rOptions(sel, fallbackName) {
  const ps = S.recvProducts;
  let html = '<option value="">— เลือกสินค้า —</option>';

    html += `<option value="${esc(sel)}" selected>${esc(fallbackName || sel)} (ปิดใช้งาน)</option>`;
  }
  return html + ps.map(p => `<option value="${esc(p.id)}"${p.id === sel ? ' selected' : ''}>` +
    `${esc(p.name)}${p.unit ? ' · หน่วยฐาน ' + esc(p.unit) : ''}</option>`).join('');

    if (n) n.focus();
    else { R.lines.push(newRLine()); drawRLines(); }
  });

function autoBaseQty(l) {
  const f = recvFactor(l);
  const pq = Number(l.packQty);
  l.qty = pq > 0 ? Math.round(pq * f) : '';
}

function drawRLines() {
  const R = S.recv;
  if (!R.lines.length) R.lines.push(newRLine());
  const box = $('#rcLines');
  if (!box) return;
  box.innerHTML = R.lines.map(rLineHtml).join('');
  calcReceive();
}

function calcReceive() {
  const R = S.recv;
  if (!R) return;
  let sub = 0, n = 0;
  R.lines.forEach(l => {
    const pq = Number(l.packQty), pc = Number(l.packCost), q = Number(l.qty);
    const ok = !l.del && l.productId && l.packQty !== '' && l.packCost !== '' && l.qty !== '' &&
      pq > 0 && pc >= 0 && q > 0;
    l._sub = ok ? r2(pq * pc) : 0;
    l._ok = ok;
    if (ok) { sub += l._sub; n++; }
  });
  sub = r2(sub);
  let disc = Number(R.discount);
  if (!isFinite(disc) || disc < 0) disc = 0;
  const over = disc > sub;
  if (over) disc = sub;
  const pct = sub ? disc / sub : 0;
  let net = 0;
  R.lines.forEach(l => {
    l._net = l._ok ? r2(l._sub * (1 - pct)) : 0;
    l._unit = l._ok && Number(l.qty) ? r4(l._net / Number(l.qty)) : 0;
    if (l._ok) net += l._net;
    const row = $(`#rcLines .rline[data-k="${l.k}"]`);
    if (!row) return;
    row.querySelector('[data-o="sub"]').textContent = l._ok ? money(l._sub) : '–';
    row.querySelector('[data-o="net"]').textContent = l._ok ? money(l._net) : '–';
    row.querySelector('[data-o="unitCost"]').textContent = l._ok ? money(l._unit) : '–';
    const note = row.querySelector('[data-o="note"]');
    if (note) {
      const f = recvFactor(l);
      const expect = Number(l.packQty) > 0 ? Math.round(Number(l.packQty) * f) : 0;
      const q2 = Number(l.qty);
      const base = recvProduct(l) ? unitsOf(recvProduct(l))[0].name : 'หน่วย';
      let html = '';
      if (l._ok && Number(l.packCost) === 0) {
        html = '<span class="badge green gift">ของแถม</span> ต้นทุน 0';
      } else if (l._ok && expect && q2 !== expect) {
        const diff = q2 - expect;
        html = `${diff > 0 ? 'ได้เพิ่ม' : 'ได้น้อยกว่าสูตร'} ${nf(Math.abs(diff))} ${esc(base)} ` +
          `· ต้นทุนเฉลี่ย ${money(l._unit)}/${esc(base)}`;
      } else if (l._ok && f > 1) {
        html = `${nf(l.packQty)} × ${nf(f)} = ${nf(q2)} ${esc(base)}`;
      }
      note.innerHTML = html;
    }
  });
  net = r2(net);
  R._sub = sub;
  R._disc = r2(disc);
  R._net = net;
  R._count = n;
  const sums = $('#rSums');
  if (sums) {
    sums.innerHTML = `<div>ยอดก่อนลด <b>${money(sub)}</b></div>
      <div>ส่วนลด <b${disc ? ' class="neg"' : ''}>${disc ? '-' + money(disc) : money(0)}</b> ${disc ? `(${(pct * 100).toFixed(2)}%)` : ''}</div>
      <span class="net">${money(net)}</span>${over ? '<div class="neg">ส่วนลดมากกว่ายอดรวม ระบบใช้เท่ายอดรวมให้</div>' : ''}`;
  }
  if ($('#rcTotal')) {
    $('#rcTotal').textContent = money(net);
    $('#rcCount').textContent = `ยอดสุทธิ · ${n} รายการ`;
  }
}

function collectReceive() {
  const R = S.recv;
  const items = [];
  R.lines.forEach((l, i) => {
    const blank = !l.lotId && !l.productId && l.packQty === '' && l.packCost === '' && l.qty === '' && !l.mfgLot;
    if (blank) return;
    if (l.del) {
      if (l.lotId) items.push({ lotId: l.lotId, productId: l.productId, delete: true });
      return;
    }
    const no = `รายการที่ ${i + 1}: `;
    const pq = Number(l.packQty), pc = Number(l.packCost), q = Number(l.qty);
    if (!l.productId) throw new Error(no + 'ยังไม่ได้เลือกสินค้า');
    if (l.packQty === '' || !(pq > 0)) throw new Error(no + 'จำนวนที่รับต้องมากกว่า 0');
    if (l.packCost === '' || !isFinite(pc) || pc < 0) throw new Error(no + 'กรุณาระบุราคา/หน่วยรับ');
    if (l.qty === '' || !Number.isInteger(q) || q <= 0) throw new Error(no + 'จำนวนที่เข้าสต็อกต้องเป็นจำนวนเต็มมากกว่า 0');
    if (q < l.sold) throw new Error(no + `ขายไปแล้ว ${l.sold} จำนวนรับต้องไม่น้อยกว่านี้`);
    items.push({ lotId: l.lotId, productId: l.productId, recvUnit: l.recvUnit,
      packQty: pq, packCost: pc, qty: q, mfgLot: (l.mfgLot || '').trim() });
  });
  if (!R.vendor.trim()) throw new Error('กรุณาระบุร้านค้า / บริษัท');
  if (R.payment.status === 'CLAIM' && !R.payment.claimUserId) throw new Error('กรุณาเลือกผู้เบิก');
  if (R.payment.status === 'PAID' && !R.payment.wallet) throw new Error('กรุณาเลือกกระเป๋าที่จ่ายเงิน');
  return { items: items };
}

async function saveReceive(btn) {
  const R = S.recv;
  let c;
  try { c = collectReceive(); } catch (e) { toast(e.message, true); return; }
  const live = c.items.filter(i => !i.delete);
  if (!live.length) {
    if (R.mode === 'new') { toast('ยังไม่มีรายการสินค้า', true); return; }
    if (!armed(btn, 'กดอีกครั้ง: ลบทุกรายการ = ยกเลิกใบรับ')) return;
  }
  if (live.length) {
    const ok = await confirmBox(R.mode === 'edit' ? 'ยืนยันการแก้ไขใบรับสินค้า' : 'ยืนยันการรับสินค้า',
      `${R.mode === 'edit' ? 'แก้ไขเป็น' : 'รับสินค้า'} <b>${live.length}</b> รายการ ยอดสุทธิ <b>${money(R._net)}</b><br>` +
      `สถานะ: <b>${PAY_TH[R.payment.status]}</b>` +
      (R.payment.status === 'PAID' ? ` · ตัดจากกระเป๋า<b>${WALLET_TH[R.payment.wallet]}</b>` : '') +
      (R.mode === 'edit' ? '<br><span class="muted">ส่วนต่างของยอดเงินจะถูกปรับเข้ากระเป๋าให้อัตโนมัติ</span>' : ''),
      'บันทึก');
    if (!ok) return;
  }
  btn.disabled = true;
  let docDate;
  try { docDate = docDateValue(R); } catch (e) { toast(e.message, true); btn.disabled = false; return; }
  const payload = {
    receiveId: R.receiveId, vendor: R.vendor.trim(), docType: R.docType, note: R.note, docDate: docDate,
    discount: Number(R.discount) || 0, items: c.items,
    paymentStatus: R.payment.status, wallet: R.payment.wallet, claimUserId: R.payment.claimUserId,
    purchaseImages: R.buy.add, paymentImages: R.pay.add,
    keepPurchase: R.buy.keep.map(f => f.id), keepPayment: R.pay.keep.map(f => f.id)
  };
  try {
    const d = await api(R.mode === 'edit' ? 'updateReceive' : 'createReceive', S.token, payload);
    const wasEdit = R.mode === 'edit';
    S.recv = null;
    markStale('recvList');
    renderReceive($('#view'), S.seq);
    toast(wasEdit
      ? 'บันทึกการแก้ไขแล้ว' + (d.salesRecalculated ? ` · คำนวณกำไรบิลเดิมใหม่ ${d.salesRecalculated} บิล` : '')
      : 'บันทึกรับสินค้าแล้ว ' + d.receiveId);
    showReceiveResult(d);
  } catch (e) {
    if (btn.isConnected) btn.disabled = false;
    fail(e);
  }
}

async function openReceiveDetail(rid) {
  try { showReceiveResult(await api('getReceiveDetail', S.token, rid), true); }
  catch (e) { fail(e); }
}

function showReceiveResult(d, canEdit) {
  const lineRows = (ls, dim) => ls.map(l => `<tr${dim ? ' class="dim"' : ''}><td class="id">${esc(l.lotId)}</td>
          <td>${esc(l.name)}${l.lineTotal === 0 ? ' <span class="badge green gift">ของแถม</span>' : ''}</td>
          <td>${esc(l.packUnit) || '–'}</td><td class="num">${nf(l.packQty)}</td><td class="num">${money(l.packCost)}</td>
          <td class="num">${nf(l.qty)}</td><td class="num">${money(l.unitCost)}</td>
          <td class="num">${money(l.lineTotal)}</td><td>${esc(l.mfgLot) || '–'}</td></tr>`).join('');

  openModal({
    wide: true,
    title: 'ใบรับสินค้า ' + d.receiveId,
    body: `${d.status === 'VOID' ? `<div class="warn-box"><b>ใบรับนี้ถูกยกเลิกแล้ว</b>
        ${esc(d.voidBy)} · ${dtThai(d.voidAt)}<br>เหตุผล: ${esc(d.voidReason)} · รายการสินค้าด้านล่างคือของที่เคยอยู่ในใบนี้ (ไม่นับเป็นสต็อกแล้ว)</div>` : ''}
      <div class="rc-meta">
        <div><span>ร้านค้า / บริษัท</span><br><b>${esc(d.vendor)}</b> ${docBadge(d.docType)}</div>
        <div><span>วันที่-เวลา</span><br><b>${dtThai(d.date)}</b>
          ${d.updatedBy ? `<br><span class="muted">แก้ไขล่าสุดโดย ${esc(d.updatedBy)} ${dtThai(d.updatedAt)}</span>` : ''}</div>
        <div><span>ยอดสุทธิ</span><br><b>${money(d.total)}</b>
          ${d.discount ? `<span class="muted"> (ก่อนลด ${money(d.sub)} ลด ${money(d.discount)})</span>` : ''}</div>
        <div><span>การชำระเงิน</span><br>${payBadge(d.paymentStatus)}
          ${d.paymentStatus === 'PAID' ? walletBadge(d.wallet) : d.paymentStatus === 'CLAIM' ? esc(d.claimUserName) : ''}</div>
      </div>
      <div class="table-wrap"><table class="tbl">
        <thead><tr><th>เลข Lot</th><th>สินค้า</th><th>รับเป็น</th><th class="num">จำนวน</th><th class="num">ราคา/หน่วยรับ</th>
          <th class="num">เข้าสต็อก</th><th class="num">ต้นทุน/หน่วย</th><th class="num">รวมสุทธิ</th><th>Lot ผู้ผลิต</th></tr></thead>
        <tbody>${lineRows(d.lines, false)}${lineRows(voidLines, true)}</tbody>
      </table></div>
      ${voidLines.length && d.status !== 'VOID' ? `<p class="hint">แถวสีจางคือรายการที่ถูกลบออกจากใบนี้ภายหลัง (เก็บไว้เป็นประวัติ)</p>` : ''}
      <div class="block"><h3>รูปหลักฐาน</h3>
        <div class="ev-row"><span>หลักฐานการสั่งซื้อ</span>${d.purchaseFiles.length
          ? `<button type="button" class="btn sm" data-gal="buy">ดูรูป (${d.purchaseFiles.length})</button>` : '<span class="muted">ไม่มีรูป</span>'}</div>
        <div class="ev-row"><span>หลักฐานการชำระเงิน</span>${d.paymentFiles.length

      </div>
      ${d.note ? `<p class="note">หมายเหตุ: ${esc(d.note)}</p>` : ''}
      ${canEdit && S.perms.receive && !receiveEditable(d) && d.status !== 'VOID'
        ? `<p class="note warn">ใบรับนี้เกิน ${S.perms.editWindowDays} วันแล้ว เฉพาะผู้ดูแลระบบเท่านั้นที่แก้ไขได้ — ถ้ายอดไม่ตรงให้ใช้เมนูปรับยอด</p>` : ''}`,
    foot: (canEdit ? '<button class="btn" id="rvTrail">ประวัติการแก้ไข</button>' : '') +
      (canEdit && S.perms.receive && receiveEditable(d) ? '<button class="btn danger" id="rcVoid">ยกเลิกใบรับ</button>' : '') +
      '<button class="btn" data-x>ปิด</button>' +
      (canEdit && S.perms.receive && receiveEditable(d) ? '<button class="btn primary" id="rcEdit">แก้ไขใบรับนี้</button>' : '')

  $$('#modalBody [data-gal]').forEach(b => {
    b.onclick = () => b.dataset.gal === 'buy'
      ? openGallery('หลักฐานการสั่งซื้อ ' + d.receiveId, d.purchaseFiles.map(f => ({ id: f.id })), 0)

  });
  if ($('#rvTrail')) $('#rvTrail').onclick = () => openAuditTrail(d.receiveId);
  if ($('#rcEdit')) $('#rcEdit').onclick = () => { closeModal(); startReceive(d.receiveId, d); };
  if ($('#rcVoid')) $('#rcVoid').onclick = () => voidReceiveModal(d);
}

function voidReceiveModal(d) {
  const sold = d.lines.filter(l => l.sold > 0);
  openModal({
    title: 'ยกเลิกใบรับ ' + d.receiveId,
    body: sold.length
      ? `<div class="warn-box"><b>ยกเลิกไม่ได้</b> มีของจากใบนี้ถูกขายไปแล้ว: ${sold.map(l => esc(l.name) + ' (' + nf(l.sold) + ')').join(', ')}

      : `<div class="warn-box"><b>ของทั้ง ${d.lines.length} รายการจะถูกตัดออกจากสต็อก</b>
          ${d.paymentStatus === 'PAID' ? 'และคืนเงิน ' + money(d.total) + ' เข้ากระเป๋า' + (WALLET_TH[d.wallet] || '') : 'ใบนี้ยังไม่ได้ตัดเงิน จึงไม่มีการคืนเงิน'}
          · ใบรับและรายการสินค้ายังเปิดดูได้ แต่จะติดสถานะ "ยกเลิก"</div>
        <label class="field" style="margin-top:14px"><span>เหตุผลการยกเลิก *</span>
          <input id="rvReason" maxlength="200" placeholder="เช่น คีย์ผิดใบ / ของถูกส่งคืน"></label>`,
    foot: '<button class="btn" data-x>ปิด</button>' +
      (sold.length ? '' : '<button class="btn danger" id="rvOk">ยืนยันยกเลิกใบรับ</button>'),
    focus: sold.length ? null : '#rvReason'
  });
  if (!$('#rvOk')) return;
  $('#rvOk').onclick = async () => {
    const btn = $('#rvOk');
    const reason = $('#rvReason').value.trim();
    if (!reason) { toast('กรุณาระบุเหตุผล', true); return; }
    if (!armed(btn, 'กดอีกครั้งเพื่อยืนยันการยกเลิก')) return;
    btn.disabled = true;
    try {
      const nd = await api('voidReceive', S.token, d.receiveId, reason);
      toast('ยกเลิกใบรับ ' + d.receiveId + ' แล้ว');
      markStale('recvList');
      if (S.view === 'receive' && !S.recv) renderReceive($('#view'), S.seq);
      S.ctxAt.sale = 0;
      showReceiveResult(nd, true);
    } catch (e) { if (btn.isConnected) btn.disabled = false; fail(e); }
  };
}

function openReceiveById(rid) {
  if (S.view === 'receive') { startReceive(rid); return; }
  S.recvOpen = rid;
  go('receive');
}

  <script>
'use strict';
/* MolaMola Care — ไฟล์สคริปต์ส่วนที่ 3 จาก 3 (ต้องวางให้ครบทุกไฟล์ เรียงตามลำดับ) */
/* =====================================================================
 * ADJUST — ปรับยอด

let aSeq = 0;
function newALine(o) {
  return Object.assign({ k: ++aSeq, productId: '', name: '', direction: 'IN', qty: '', unitCost: '',
    mfgLot: '' }, o || {});
}

function renderAdjust(el, seq) {
  if (S.adj) drawAdjustForm(el, seq);
  else drawAdjustList(el, seq);
}

function drawAdjustList(el, seq) {
  const st = listState('adjList');
  el.innerHTML = `<button type="button" class="doc-new" id="newAdj">
      <span class="plus">+</span>
      <span><b>เพิ่มรายการปรับยอด</b><span>ใช้เมื่อยอดเงินหรือยอดสินค้าจริงไม่ตรงกับระบบ</span></span>
    </button>
    ${rangeBar('al', st)}
    ${listStamp(st, 'al')}
    <div class="card"><div class="table-wrap" id="alTable"></div></div>`;
  $('#newAdj').onclick = startAdjust;
  const draw = () => {
    if (!alive(seq)) return;
    if (!$('.list-stamp') && st.rows) { drawAdjustList(el, seq); return; }
    fillAdjustList(st.rows);
  };
  wireList('al', st, 'getAdjusts', draw, seq);
  draw();
}

function fillAdjustList(rows) {
  const box = $('#alTable');
  if (!box) return;
  if (!rows) { box.innerHTML = listPrompt(); return; }
  if (!rows.length) { box.innerHTML = '<p class="empty">ไม่มีรายการปรับยอดในช่วงนี้</p>'; return; }
  const srt = sortState('adjust', 'date', 'desc');
  const orig = rows;
  rows = sorted(rows.map(a => Object.assign({}, a, { _value: a.kind === 'MONEY' ? (a.direction === 'IN' ? a.amount : -a.amount) : a.value })), srt);
  box.innerHTML = `<table class="tbl">
    <thead><tr><th class="dt" data-k="date" data-d="desc">วันที่-เวลา</th><th class="cm" data-k="kind">รายการ / เลขที่</th>
      <th class="num" data-k="_value" data-d="desc">มูลค่า</th><th class="hide-m" data-k="userName">ผู้ปรับยอด</th><th class="hide-m" data-k="note">เหตุผล</th></tr></thead>
    <tbody>${rows.map(a => {
      const money_ = a.kind === 'MONEY';
      const detail = money_
        ? `${walletBadge(a.walletId)} ${a.direction === 'IN' ? 'เงินเข้า' : 'เงินออก'}`
        : `${a.stockIn ? `<span class="badge green">รับเข้า ${nf(a.stockIn)}</span> ` : ''}` +
          `${a.stockOut ? `<span class="badge red">จ่ายออก ${nf(a.stockOut)}</span> ` : ''}` +
          `<span class="muted">${nf(a.itemCount)} รายการ</span>`;
      const val = money_ ? (a.direction === 'IN' ? a.amount : -a.amount) : a.value;
      return `<tr class="click" data-id="${esc(a.adjustId)}">
        <td class="dt">${dtCell(a.date)}</td>
        <td class="cm"><span class="badge ${money_ ? 'blue' : 'teal'}">${money_ ? 'ยอดเงิน' : 'ยอดสินค้า'}</span> ${detail}
          <span class="sub">${shortId(a.adjustId)} · ${esc(a.note)}</span></td>
        <td class="num ${val < 0 ? 'neg' : 'pos'}">${signed(val)}</td>
        <td class="hide-m">${esc(a.userName)}</td><td class="hide-m">${esc(a.note)}</td></tr>`;
    }).join('')}</tbody></table>`;
  $$('tr.click', box).forEach(tr => { tr.onclick = () => openAdjustDetail(tr.dataset.id); });
  makeSortable(box, srt, () => fillAdjustList(orig));
}

async function startAdjust() {
  const ok = await confirmBox('ก่อนเริ่มปรับยอด',
    'การปรับยอดควรทำ<b>เฉพาะกรณีที่มูลค่าของสินค้าคงเหลือกับยอดเงินไม่สอดคล้องกัน</b>เท่านั้น<br><br>' +
    'เช่น ยอดเงินตรงแต่ยอดสินค้าไม่ตรง หรือ ยอดสินค้าตรงแต่ยอดเงินไม่ตรง<br>' +
    'ถ้าเป็นการซื้อ-ขายตามปกติ ให้ใช้เมนูจำหน่ายสินค้าหรือรับสินค้าแทน',
    'เข้าใจแล้ว เริ่มปรับยอด');

  try { await ensureCtx('adjust'); } catch (e) { fail(e); return; }
  S.adj = { kind: 'MONEY', walletId: 'CASH', direction: 'IN', amount: '', note: '', date: null, lines: [newALine()] };

    <button type="button" class="icon-btn" data-act="del" aria-label="ลบรายการ">✕</button>

function drawAdjustForm(el, seq) {
  const A = S.adj;
  el.innerHTML = `<div class="card sheet">
      <div class="sheet-head">
        <div><h2>ใบปรับยอด</h2><p class="muted">เลขที่เอกสารออกอัตโนมัติเมื่อบันทึก</p></div>

      <div id="aLines"></div>
      <button type="button" class="btn ghost" id="aAdd">+ เพิ่มสินค้า</button>
      <p class="hint">รับเข้า = เพิ่มของเข้าสต็อก (ต้องระบุต้นทุน/หน่วย เพื่อใช้คิดกำไรตอนขาย) ·
        จ่ายออก = ตัดของออกจากสต็อกแบบ FIFO ตามต้นทุน Lot เดิม</p>`;
    $('#aAdd').onclick = () => { S.adj.lines.push(newALine()); drawALines(); };
    const wrap = $('#aLines');
    const lineOf = t => {
      const row = t.closest('.aline');
      return row ? A.lines.find(l => l.k === +row.dataset.k) : null;
    };
    wrap.addEventListener('change', e => {
      const f = e.target.dataset.f;
      if (f !== 'productId' && f !== 'direction') return;
      const l = lineOf(e.target);
      if (!l) return;
      l[f] = e.target.value;
      if (f === 'productId') {
        const p = S.adjProducts.find(x => x.id === l.productId);
        l.name = p ? p.name : '';
        if (p && l.direction === 'IN' && l.unitCost === '' && p.lastCost != null) l.unitCost = p.lastCost;
      }
      drawALines();
    });
    wrap.addEventListener('input', e => {
      const f = e.target.dataset.f;
      if (!f || f === 'productId' || f === 'direction') return;
      const l = lineOf(e.target);
      if (!l) return;
      l[f] = e.target.value;
      calcAdjust();
    });
    wrap.addEventListener('click', e => {
      const b = e.target.closest('[data-act="del"]');
      if (!b) return;
      const l = lineOf(b);
      A.lines = A.lines.filter(x => x !== l);
      if (!A.lines.length) A.lines.push(newALine());
      drawALines();
    });
    drawALines();
  }
  calcAdjust();
}

function drawALines() {
  const box = $('#aLines');
  if (!box) return;
  box.innerHTML = S.adj.lines.map(aLineHtml).join('');
  calcAdjust();
}

function calcAdjust() {
  const A = S.adj;
  if (!A || !$('#aSumVal')) return;
  if (A.kind === 'MONEY') {
    const v = Number(A.amount) || 0;
    $('#aSumLbl').textContent = A.direction === 'IN' ? 'เงินเข้ากระเป๋า' : 'เงินออกจากกระเป๋า';
    $('#aSumVal').textContent = signed(A.direction === 'IN' ? v : -v);
    return;
  }
  let val = 0, n = 0;
  A.lines.forEach(l => {
    const q = Number(l.qty);
    const p = S.adjProducts.find(x => x.id === l.productId);
    if (l.productId && q > 0) {
      n++;
      if (l.direction === 'IN') val += q * (Number(l.unitCost) || 0);
      else val -= q * (p && p.lastCost ? p.lastCost : 0);
    }
    const row = $(`#aLines .aline[data-k="${l.k}"] .alloc`);
    if (row) {
      const short = l.direction === 'OUT' && p && q > 0 && q > p.stock;
      row.className = 'alloc' + (short ? ' err' : '');
      row.textContent = !p ? ''
        : short ? `คงเหลือไม่พอ (เหลือ ${nf(p.stock)})`
        : `คงเหลือ ${stockText(p)}` +
          (q > 0 ? ` → หลังปรับ ${nf(l.direction === 'IN' ? p.stock + q : p.stock - q)}` : '');
    }
  });
  $('#aSumLbl').textContent = `มูลค่าสต็อกที่เปลี่ยน · ${n} รายการ`;
  $('#aSumVal').textContent = signed(r2(val));
}

async function saveAdjust(btn) {
  const A = S.adj;
  if (!A.note.trim()) { toast('กรุณาระบุเหตุผลการปรับยอด', true); $('#aNote').focus(); return; }
  let docDate;
  try { docDate = docDateValue(A); } catch (e) { toast(e.message, true); return; }
  const payload = { kind: A.kind, note: A.note.trim(), docDate: docDate };
  let summary = '';
  if (A.kind === 'MONEY') {
    const amt = Number(A.amount);
    if (!(amt > 0)) { toast('จำนวนเงินต้องมากกว่า 0', true); return; }
    payload.walletId = A.walletId;
    payload.direction = A.direction;
    payload.amount = amt;
    summary = `${A.direction === 'IN' ? 'เงินเข้า' : 'เงินออก'} <b>${money(amt)}</b> กระเป๋า<b>${WALLET_TH[A.walletId]}</b>`;
  } else {
    const items = [];
    try {
      A.lines.forEach((l, i) => {
        if (!l.productId && l.qty === '') return;
        const no = `รายการที่ ${i + 1}: `;
        const q = Number(l.qty), c = Number(l.unitCost);
        if (!l.productId) throw new Error(no + 'ยังไม่ได้เลือกสินค้า');
        if (l.qty === '' || !Number.isInteger(q) || q <= 0) throw new Error(no + 'จำนวนต้องเป็นจำนวนเต็มมากกว่า 0');
        if (l.direction === 'IN' && (l.unitCost === '' || !isFinite(c) || c < 0)) throw new Error(no + 'รายการรับเข้าต้องระบุต้นทุน/หน่วย');
        const p = S.adjProducts.find(x => x.id === l.productId);
        if (l.direction === 'OUT' && p && q > p.stock) throw new Error(no + `${p.name} คงเหลือไม่พอ (เหลือ ${nf(p.stock)})`);
        items.push({ productId: l.productId, direction: l.direction, qty: q,
          unitCost: l.direction === 'IN' ? c : '', mfgLot: l.mfgLot || '' });
      });
    } catch (e) { toast(e.message, true); return; }
    if (!items.length) { toast('ยังไม่มีรายการสินค้า', true); return; }
    payload.items = items;
    summary = `ปรับยอดสินค้า <b>${items.length}</b> รายการ`;
  }
  const ok = await confirmBox('ยืนยันการปรับยอด', summary + `<br>เหตุผล: ${esc(A.note.trim())}`, 'บันทึกการปรับยอด');
  if (!ok) return;
  btn.disabled = true;
  try {
    const d = await api('createAdjust', S.token, payload);
    S.adj = null;
    markStale('adjList');
    S.ctxAt.sale = 0;
    renderAdjust($('#view'), S.seq);
    toast('บันทึกการปรับยอดแล้ว ' + d.adjustId);
    showAdjustDetail(d);
  } catch (e) {
    if (btn.isConnected) btn.disabled = false;
    fail(e);
  }
}

async function openAdjustDetail(id) {
  try { showAdjustDetail(await api('getAdjustDetail', S.token, id)); }
  catch (e) { fail(e); }
}

function stockBadge(p) {
  if (p.stock <= 0) return '<span class="badge red">หมด</span>';
  if (p.min > 0 && p.stock <= p.min) return '<span class="badge amber">ต่ำกว่า Min</span>';
  if (p.max > 0 && p.stock > p.max) return '<span class="badge blue">เกิน Max</span>';
  return '';
}
function renderProducts(el, seq) {
  el.innerHTML = `<div class="toolbar">
      <label class="field grow"><span>ค้นหาสินค้า</span>
        <input type="search" id="paQ" placeholder="ชื่อ หรือ รหัสสินค้า" value="${esc(S.pa.q)}"></label>
      <label class="chk"><input type="checkbox" id="paIn"${S.pa.inactive ? ' checked' : ''}> แสดงสินค้าที่ปิดใช้งาน</label>
      <button class="btn primary" id="paNew">+ เพิ่มสินค้า</button>
    </div>
    <div id="paStamp">${cacheFresh(S.pa.at) ? cacheStamp(S.pa.at, 'pa') : ''}</div>
    <div class="card"><div class="table-wrap" id="paTable"><p class="empty">กำลังโหลด…</p></div></div>`;
  $('#paQ').oninput = e => { S.pa.q = e.target.value; drawProducts(); };
  $('#paIn').onchange = e => { S.pa.inactive = e.target.checked; drawProducts(); };
  $('#paNew').onclick = () => editProduct(null);
  if ($('#paRefresh')) $('#paRefresh').onclick = () => loadProducts(seq);
  if (cacheFresh(S.pa.at)) drawProducts();      // ข้อมูลยังใหม่ ไม่ต้องโหลดซ้ำ
  else loadProducts(seq);
}

function loadProducts(seq) {
  seq = seq || S.seq;
  api('getProductsAdmin', S.token).then(rows => {
    if (!alive(seq)) return;
    S.pa.rows = rows || [];
    S.pa.at = Date.now();
    const st = $('#paStamp');
    if (st) { st.innerHTML = cacheStamp(S.pa.at, 'pa'); $('#paRefresh').onclick = () => loadProducts(seq); }
    drawProducts();
  }).catch(fail);
}

function drawProducts() {
  const box = $('#paTable');
  if (!box) return;
  const q = S.pa.q.trim().toLowerCase();

    (!q || p.name.toLowerCase().indexOf(q) >= 0 || p.id.toLowerCase().indexOf(q) >= 0));
  if (!rows.length) {
    box.innerHTML = `<p class="empty">${S.pa.rows.length ? 'ไม่พบสินค้าที่ค้นหา' : 'ยังไม่มีสินค้า — กด “เพิ่มสินค้า” เพื่อเริ่มต้น'}</p>`;
    return;
  }
  const srt = sortState('products', 'name', 'asc');
  const sortedRows = sorted(rows, srt);
  box.innerHTML = `<table class="tbl">
    <thead><tr><th class="cm" data-k="name">ชื่อสินค้า</th><th class="num" data-k="stock" data-d="desc">คงเหลือ</th>

        : '';
      const extra = unitsOf(p).filter(u => !u.base).map(u => u.sell === false
        ? `${esc(u.name)} = ${nf(u.factor)} ${esc(p.unit)} (รับเข้า)` : `${esc(u.name)} = ${nf(u.factor)} ${esc(p.unit)} ${money(u.price)}`).join(' · ');
      return `<tr class="click${p.active ? '' : ' dim'}" data-pid="${esc(p.id)}">
        <td class="cm"><b>${esc(p.name)}</b>${p.unit ? ` <span class="muted">/ ${esc(p.unit)}</span>` : ''}
          ${p.active ? '' : ' <span class="badge">ปิดใช้งาน</span>'}
          <span class="sub"><span class="only-m">${money(p.price)}/${esc(p.unit)} · </span>${shortId(p.id)}${extra ? ' · ' + extra : ''}</span></td>
        <td class="num wrap">${stockBadge(p)} <b>${esc(stockText(p))}</b>${meter}</td>
        <td class="num hide-m">${nf(p.min)} / ${p.max ? nf(p.max) : '–'}</td>
        <td class="num hide-m">${money(p.price)}</td>
        <td class="num hide-m">${p.lastCost == null ? '–' : money(p.lastCost)}</td>
        <td class="num hide-m">${nf(p.liveLots)} / ${nf(p.totalLots)}</td>
        <td class="actions-cell hide-m">
          <button class="btn sm" data-edit="${esc(p.id)}">แก้ไข</button>
          <button class="btn sm ghost" data-lots="${esc(p.id)}">ประวัติ Lot</button>
        </td></tr>`;
    }).join('')}</tbody>
  </table>`;
  $$('[data-edit]', box).forEach(b => { b.onclick = e => { e.stopPropagation(); editProduct(b.dataset.edit); }; });
  $$('[data-lots]', box).forEach(b => { b.onclick = e => { e.stopPropagation(); openLots(b.dataset.lots); }; });
  $$('tr.click', box).forEach(tr => { tr.onclick = () => editProduct(tr.dataset.pid); });
  makeSortable(box, srt, drawProducts);
}

function editProduct(id) {

  const baseName0 = p ? unitsOf(p)[0].name : '';
  const extras = (p ? unitsOf(p).filter(u => !u.base) : []).map(u => ({
    k: ++uSeq, name: u.name, qty: u.qty || u.factor, of: u.of || baseName0,
    price: u.sell === false ? '' : u.price, sell: u.sell !== false
  }));

    wide: true,
    title: p ? 'แก้ไขสินค้า ' + p.id : 'เพิ่มสินค้าใหม่',
    body: `<section class="pf-sec">
        <h4>1. ข้อมูลสินค้า</h4>

          <label class="field full"><span>ชื่อสินค้า *</span>

          <label class="field"><span>หน่วยฐาน * <small class="muted">(หน่วยที่เล็กที่สุด ใช้นับสต็อก)</small></span>

            <input id="pfPrice" type="number" min="0" step="0.01" inputmode="decimal" value="${p ? p.price : ''}"></label>
        </div>
      </section>

      <section class="pf-sec">
        <div class="pf-sec-head">
          <h4>2. หน่วยขาย</h4>
          <button type="button" class="btn sm" id="pfAddUnit">+ เพิ่มหน่วย</button>
        </div>
        <p class="hint">กรณีไม่ระบุหน่วยขาย จะใช้ข้อมูลของหน่วยฐาน ·
          หน่วยที่ไม่ติ๊ก "ใช้ขาย" ใช้เป็นหน่วยรับเข้าอย่างเดียว เช่น โหล = 12 กล่อง</p>
        <div class="uline line-head"><span>ชื่อหน่วย</span><span>เท่ากับ</span>
          <span class="r">ราคาขาย/หน่วย</span><span class="c">ใช้ขาย</span><span></span></div>
        <div class="uline base-row">
          <div class="cell"><span class="cap">ชื่อหน่วย</span><span><b data-base>หน่วยฐาน</b> <span class="badge teal">หน่วยฐาน</span></span></div>
          <div class="cell"><span class="cap">เท่ากับ</span><span>1 <span data-base>หน่วยฐาน</span></span></div>
          <div class="cell num"><span class="cap">ราคาขาย/หน่วย</span><span id="pfBasePrice">–</span></div>
          <div class="cell c"><span class="cap">ใช้ขาย</span><span class="badge green">ขายได้</span></div>
          <span></span>
        </div>
        <div id="pfUnits"></div>
      </section>

      <section class="pf-sec">
        <h4>3. สต็อก</h4>
        <div class="form-grid">
          <label class="field"><span>Min Stock <small class="muted">(แจ้งเตือนเมื่อต่ำกว่า)</small></span>
            <input id="pfMin" type="number" min="0" step="1" inputmode="numeric" value="${p ? p.min : 0}"></label>
          <label class="field"><span>Max Stock</span>
            <input id="pfMax" type="number" min="0" step="1" inputmode="numeric" value="${p ? p.max : 0}"></label>
          <label class="field full"><span>คงเหลือปัจจุบัน <small class="muted">(คำนวณจาก Lot · เพิ่มผ่านเมนูรับสินค้า)</small></span>
            <input value="${p ? esc(stockText(p)) : '0'}" disabled></label>
        </div>
      </section>

      <label class="chk"><input type="checkbox" id="pfActive"${!p || p.active ? ' checked' : ''}>
        เปิดใช้งาน (แสดงในหน้าจำหน่ายและรับสินค้า)</label>`,
    foot: (p ? '<button class="btn ghost" id="pfLots">ประวัติ Lot</button>' : '') +
      '<button class="btn" data-x>ปิด</button><button class="btn primary" id="pfSave">บันทึก</button>',
    focus: '#pfName'
  });
  if ($('#pfLots')) $('#pfLots').onclick = () => openLots(p.id);

  const baseLbl = () => {
    const u = $('#pfUnit').value.trim() || '(ยังไม่ตั้งชื่อหน่วยฐาน)';
    $$('#modalBody [data-base]').forEach(e => { e.textContent = u; });
    const pr = $('#pfPrice').value;
    $('#pfBasePrice').textContent = pr === '' ? '–' : money(pr);
  };
  const baseName = () => $('#pfUnit').value.trim() || 'หน่วยฐาน';
  // แปลงทุกหน่วยเป็นจำนวนหน่วยฐาน (อ้างอิงหน่วยที่อยู่บรรทัดก่อนหน้าได้ เช่น โหล = 12 กล่อง)
  const resolve = () => {
    const map = {};
    map[baseName()] = 1;
    extras.forEach(u => {
      const q = Number(u.qty);
      const of = map[u.of] !== undefined ? map[u.of] : (u.of === baseName() ? 1 : NaN);
      u._factor = Number.isInteger(q) && q > 0 && isFinite(of) ? q * of : NaN;
      if (u.name && isFinite(u._factor)) map[String(u.name).trim()] = u._factor;
      const row = $(`#pfUnits .uline[data-k="${u.k}"] [data-o="eq"]`);
      if (row) {
        row.textContent = isFinite(u._factor) ? `= ${nf(u._factor)} ${baseName()}` : 'ระบุจำนวนให้ถูกต้อง';
        row.className = 'u-eq-note' + (isFinite(u._factor) ? '' : ' err');
      }
    });
  };
  const ofOptions = (idx, sel) => {
    const names = [baseName()].concat(extras.slice(0, idx).map(x => String(x.name).trim()).filter(Boolean));
    if (sel && names.indexOf(sel) < 0) names.push(sel);
    return names.map(n => `<option value="${esc(n)}"${n === sel ? ' selected' : ''}>${esc(n)}</option>`).join('');
  };
  const drawUnits = () => {
    const box = $('#pfUnits');
    box.innerHTML = extras.map((u, idx) => `<div class="uline${u.sell ? '' : ' buy-only'}" data-k="${u.k}">
        <label class="cell"><span class="cap">ชื่อหน่วย</span>
          <input data-u="name" maxlength="20" placeholder="เช่น กล่อง, โหล" value="${esc(u.name)}"></label>
        <div class="cell"><span class="cap">เท่ากับ</span>
          <div class="u-eq">
            <input data-u="qty" type="number" min="1" step="1" inputmode="numeric" placeholder="12" value="${esc(u.qty)}">
            <select data-u="of">${ofOptions(idx, u.of || baseName())}</select>
          </div>
          <small data-o="eq" class="u-eq-note"></small></div>
        <label class="cell num"><span class="cap">ราคาขาย/หน่วย</span>
          <input data-u="price" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(u.price)}"${
            u.sell ? '' : ' disabled placeholder="ไม่ขาย"'}></label>
        <label class="cell c"><span class="cap">ใช้ขาย</span>
          <input data-u="sell" type="checkbox"${u.sell ? ' checked' : ''}></label>
        <button type="button" class="icon-btn" data-udel="${u.k}" aria-label="ลบหน่วย">✕</button>
      </div>`).join('');
    $$('[data-u]', box).forEach(inp => {
      const u = extras.find(x => x.k === +inp.closest('.uline').dataset.k);
      const f = inp.dataset.u;
      if (f === 'sell') {
        inp.onchange = () => { u.sell = inp.checked; if (!u.sell) u.price = ''; drawUnits(); };
      } else if (f === 'of') {
        inp.onchange = () => { u.of = inp.value; resolve(); };
      } else {
        inp.oninput = () => { u[f] = inp.value; resolve(); };
        if (f === 'name') inp.onchange = () => drawUnits();
      }
    });
    $$('[data-udel]', box).forEach(b => {
      b.onclick = () => {
        const i2 = extras.findIndex(x => x.k === +b.dataset.udel);
        if (i2 >= 0) extras.splice(i2, 1);
        drawUnits();
      };
    });
    resolve();
  };
  $('#pfUnit').oninput = () => { baseLbl(); };
  $('#pfUnit').onchange = () => {
    extras.forEach(u => { if (!u.of || u.of === baseName0) u.of = baseName(); });
    drawUnits();
  };
  $('#pfPrice').oninput = baseLbl;
  $('#pfAddUnit').onclick = () => {
    extras.push({ k: ++uSeq, name: '', qty: '', of: baseName(), price: '', sell: true });
    drawUnits();
    const last = $$('#pfUnits [data-u="name"]').pop();
    if (last) last.focus();
  };
  baseLbl();
  drawUnits();
  $('#pfSave').onclick = async () => {
    const data = {
      id: p ? p.id : '',
      name: $('#pfName').value.trim(),
      unit: $('#pfUnit').value.trim(),
      units: (resolve(), extras.map(u => ({
        name: String(u.name).trim(), qty: Number(u.qty), of: u.of || baseName(),
        factor: u._factor, sell: !!u.sell, price: u.sell ? Number(u.price) : 0, _priceRaw: u.price
      }))),
      price: $('#pfPrice').value,
      min: $('#pfMin').value || 0,
      max: $('#pfMax').value || 0,
      active: $('#pfActive').checked
    };
    if (!data.name) { toast('กรุณาระบุชื่อสินค้า', true); return; }
    if (!data.unit) { toast('กรุณาระบุหน่วยฐาน', true); return; }
    if (data.price === '') { toast('กรุณาระบุราคาขาย', true); return; }
    for (const u of data.units) {
      if (!u.name) { toast('กรุณาตั้งชื่อหน่วยให้ครบทุกบรรทัด', true); return; }
      if (!(u.factor > 1)) { toast(`หน่วย ${u.name}: ต้องมากกว่า 1 ${data.unit}`, true); return; }
      if (u.sell && (u._priceRaw === '' || !(u.price >= 0))) { toast(`หน่วย ${u.name}: กรุณาระบุราคาขาย`, true); return; }
      delete u._priceRaw;
    }
    try {
      await api('saveProduct', S.token, data);
      closeModal();
      toast(p ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่มสินค้าแล้ว');
      loadProducts();
    } catch (e) { fail(e); }
  };
}

async function openLots(id) {

function showLots(d) {
  const lots = d.lots;
  const unit = d.product.unit ? ' ' + esc(d.product.unit) : '';
  const next = lots.find(l => l.remaining > 0);
  const tot = k => lots.filter(l => l.status !== 'VOID').reduce((s, l) => s + l[k], 0);
  const statusBadge = l => {
    if (l === next) return '<span class="badge teal">ขายลำดับถัดไป</span>';
    if (l.status === 'VOID') return '<span class="badge red">ยกเลิก</span>';
    if (l.status === 'SOLD_OUT') return '<span class="badge">หมดแล้ว</span>';
    return '<span class="badge green">มีของ</span>';
  };
  openModal({
    wide: true,
    title: 'ประวัติ Lot — ' + d.product.name,
    body: `<div class="rc-meta">
        <div><span>รหัสสินค้า</span><br><b>${esc(d.product.id)}</b></div>
        <div><span>คงเหลือรวม</span><br><b>${nf(tot('remaining'))}${unit}</b> จาก ${lots.filter(l => l.remaining > 0).length} Lot</div>
        <div><span>รับเข้าทั้งหมด</span><br>${nf(tot('received'))}${unit} (${lots.length} Lot)</div>
        <div><span>ตัดออกไปแล้ว</span><br>${nf(tot('sold'))}${unit}</div>
      </div>
      <p class="note">ตัดสต็อกแบบ FIFO — ขาย Lot ที่รับเข้าก่อนเสมอ (เรียงตามวันที่รับ)</p>
      ${lots.length ? `<div class="table-wrap" id="lotTable"><table class="tbl">
        <thead><tr><th>#</th><th data-k="lotId">เลข Lot</th><th data-k="source">ที่มา</th><th data-k="receiveDate">วันที่รับ</th><th>รับเป็น</th><th data-k="mfgLot">Lot ผู้ผลิต</th>
          <th class="num" data-k="received" data-d="desc">รับ</th><th class="num" data-k="sold" data-d="desc">ตัดออก</th>
          <th class="num" data-k="remaining" data-d="desc">คงเหลือ</th><th class="num" data-k="unitCost" data-d="desc">ต้นทุน/หน่วย</th><th data-k="status">สถานะ</th></tr></thead>
        <tbody>${sorted(lots.map((l, i) => Object.assign({ _i: i + 1 }, l)), sortState('lots')).map(l => `<tr class="${l.remaining <= 0 || l.status === 'VOID' ? 'dim' : ''}">
          <td>${l._i}</td>
          <td class="id">${esc(l.lotId)}</td>
          <td class="id">${l.source === 'ADJUST'
            ? `<span class="badge amber">ปรับยอด</span> ${esc(l.refId)}`
            : (S.perms.receive ? `<button class="link" data-rcv="${esc(l.refId)}">${esc(l.refId)}</button>` : esc(l.refId))}</td>
          <td>${dtThai(l.receiveDate)}</td>
          <td>${l.packUnit ? `${nf(l.packQty)} ${esc(l.packUnit)} @${money(l.packCost)}` : '<span class="muted">–</span>'}</td>
          <td>${esc(l.mfgLot) || '–'}</td>
          <td class="num">${nf(l.received)}</td>
          <td class="num">${nf(l.sold)}<div class="meter"><span style="width:${l.received ? Math.min(100, l.sold / l.received * 100) : 0}%"></span></div></td>
          <td class="num"><b>${nf(l.remaining)}</b></td>
          <td class="num">${money(l.unitCost)}</td>
          <td>${statusBadge(l)}</td>
        </tr>`).join('')}</tbody>
      </table></div>` : '<p class="empty">ยังไม่มีการรับสินค้านี้</p>'}`,
    foot: '<button class="btn" data-x>ปิด</button>'
  });
  $$('#modalBody [data-rcv]').forEach(b => { b.onclick = () => { closeModal(); openReceiveById(b.dataset.rcv); }; });
  if ($('#lotTable')) makeSortable($('#lotTable'), sortState('lots'), () => showLots(d));
}

function renderStaff(el, seq) {
  el.innerHTML = `<div class="toolbar">
      <span class="muted">เพิ่มเจ้าหน้าที่และกำหนดสิทธิ์ได้จากหน้านี้ · ผู้ใช้ใหม่จะตั้ง PIN เองเมื่อเลือกชื่อครั้งแรก</span>
      <button class="btn primary" id="stNew">+ เพิ่มเจ้าหน้าที่</button>
    </div>
    <div id="stStamp"></div>
    <div class="card"><div class="table-wrap" id="stTable"><p class="empty">กำลังโหลด…</p></div></div>`;
  const roleBadge = r => `<span class="badge ${r === 'Admin' ? 'teal' : r === 'Staff' ? 'blue' : ''}">${esc(ROLE_TH[r] || r)}</span>`;
  const stamp = () => {
    const box = $('#stStamp');
    if (!box) return;
    box.innerHTML = cacheStamp(S.staffAt, 'st');
    $('#stRefresh').onclick = () => load();
  };
  const load = () => api('getStaff', S.token).then(rows => {
    S.staffRows = rows || [];
    S.staffAt = Date.now();
    if (alive(seq)) { stamp(); draw(S.staffRows); }
  }).catch(fail);
  $('#stNew').onclick = () => editStaff(null, load);
  const draw = rows => {
    const box = $('#stTable');
    if (!box) return;
    if (!rows.length) { box.innerHTML = '<p class="empty">ยังไม่มีรายชื่อ</p>'; return; }
    const srt = sortState('staff');
    const orig = rows;
    const byDefault = (a, b) => (b.active - a.active) || (ROLE_RANK[a.role] - ROLE_RANK[b.role]) || a.name.localeCompare(b.name, 'th');
    rows = sorted(rows.map(u => Object.assign({}, u, { _role: ROLE_RANK[u.role] })), srt, byDefault);
    box.innerHTML = `<table class="tbl">
      <thead><tr><th class="cm" data-k="name">ชื่อ</th><th data-k="_role">สิทธิ์</th><th class="hide-m" data-k="active" data-d="desc">สถานะ</th>
        <th data-k="hasPin" data-d="desc">PIN</th><th class="hide-m dt" data-k="pinSetAt" data-d="desc">ตั้ง PIN เมื่อ</th><th class="hide-m"></th></tr></thead>
      <tbody>${rows.map(u => `<tr class="click${u.active ? '' : ' dim'}" data-uid="${esc(u.id)}">
        <td class="cm"><b>${esc(u.name)}</b>${u.id === S.user.id ? ' <span class="muted">(คุณ)</span>' : ''}
          ${u.active ? '' : ' <span class="badge">ปิดใช้งาน</span>'}<span class="sub">${shortId(u.id)}</span></td>
        <td>${roleBadge(u.role)}</td>
        <td class="hide-m">${u.active ? '<span class="badge green">ใช้งาน</span>' : '<span class="badge">ปิดใช้งาน</span>'}</td>
        <td>${u.hasPin ? '<span class="badge green">ตั้งแล้ว</span>' : '<span class="badge amber">ยังไม่ตั้ง</span>'}</td>
        <td class="hide-m dt">${u.pinSetAt ? dtThai(u.pinSetAt) : '–'}</td>
        <td class="actions-cell hide-m">
          ${u.id === S.user.id ? '<button class="btn sm ghost" data-me>โปรไฟล์ของฉัน</button>' : ''}
          <button class="btn sm" data-edit="${esc(u.id)}">แก้ไข</button>
          <button class="btn sm danger" data-reset="${esc(u.id)}"${u.hasPin ? '' : ' disabled'}>Reset PIN</button></td>
      </tr>`).join('')}</tbody></table>`;
    $$('[data-edit]', box).forEach(b => {
      b.onclick = e => { e.stopPropagation(); editStaff(rows.find(x => x.id === b.dataset.edit), load); };
    });
    $$('tr.click', box).forEach(tr => {
      tr.onclick = () => editStaff(rows.find(x => x.id === tr.dataset.uid), load, true);
    });
    $$('[data-me]', box).forEach(b => { b.onclick = e => { e.stopPropagation(); openProfile(); }; });
    makeSortable(box, srt, () => draw(orig));
    $$('[data-reset]', box).forEach(b => {
      b.onclick = async e => {
        e.stopPropagation();
        const u = rows.find(x => x.id === b.dataset.reset);
        const self = u.id === S.user.id;
        const ok = await confirmBox('Reset PIN',
          `ต้องการล้าง PIN ของ <b>${esc(u.name)}</b> ใช่หรือไม่?` +
          (self ? '<br><span class="neg">นี่คือบัญชีของคุณเอง — ระบบจะออกจากระบบทันที</span>' : ''),
          'Reset PIN', true);
        if (!ok) return;
        try {
          await api('resetPin', S.token, u.id);
          toast('Reset PIN ของ ' + u.name + ' แล้ว');
          if (self) doLogout(true); else load();
        } catch (e) { fail(e); }
      };
    });
  };
  if (S.staffRows && cacheFresh(S.staffAt)) { stamp(); draw(S.staffRows); }
  else load();
}

function editStaff(u, reload, withActions) {
  const self = u && u.id === S.user.id;
  openModal({
    title: u ? 'แก้ไขเจ้าหน้าที่' : 'เพิ่มเจ้าหน้าที่',
    body: `<div class="form-grid">
        ${u ? `<label class="field full"><span>รหัส</span><input value="${esc(u.id)}" disabled></label>` : ''}
        <label class="field full"><span>ชื่อ-สกุล *</span>
          <input id="sfName" maxlength="120" value="${esc(u ? u.name : '')}" placeholder="ชื่อที่จะแสดงในหน้าเข้าสู่ระบบ"></label>
        <label class="field full"><span>สิทธิ์การใช้งาน *</span>
          <select id="sfRole"${self ? ' disabled' : ''}>${['Admin', 'Staff', 'User'].map(r =>
            `<option value="${r}"${u && u.role === r ? ' selected' : (!u && r === 'User' ? ' selected' : '')}>${ROLE_TH[r]} (${r})</option>`).join('')}</select></label>
        <label class="chk full"><input type="checkbox" id="sfActive"${!u || u.active ? ' checked' : ''}${self ? ' disabled' : ''}> เปิดใช้งาน</label>
      </div>
      <p class="hint">${self ? 'บัญชีของคุณเอง — เปลี่ยนสิทธิ์หรือปิดใช้งานตัวเองไม่ได้'
        : u ? 'ถ้าปิดใช้งาน ผู้ใช้จะถูกออกจากระบบทุกอุปกรณ์ทันที'
        : 'ผู้ใช้ใหม่จะเห็นชื่อตัวเองในหน้าเข้าสู่ระบบ และตั้ง PIN 6 หลักเองเมื่อเลือกชื่อครั้งแรก'}</p>
`,
    foot: (u && self ? '<button class="btn ghost" id="sfMe">โปรไฟล์ของฉัน</button>' : '') +
      (u && u.hasPin ? '<button class="btn danger" id="sfReset">Reset PIN</button>' : '') +
      '<button class="btn" data-x>ปิด</button><button class="btn primary" id="sfSave">บันทึก</button>',
    focus: withActions ? null : '#sfName'
  });
  if ($('#sfMe')) $('#sfMe').onclick = openProfile;
  if ($('#sfReset')) {
    $('#sfReset').onclick = async () => {
      const ok = await confirmBox('Reset PIN',
        `ต้องการล้าง PIN ของ <b>${esc(u.name)}</b> ใช่หรือไม่?` +
        (self ? '<br><span class="neg">นี่คือบัญชีของคุณเอง — ระบบจะออกจากระบบทันที</span>' : ''), 'Reset PIN', true);
      if (!ok) return;
      try {
        await api('resetPin', S.token, u.id);
        toast('Reset PIN ของ ' + u.name + ' แล้ว');
        S.staffAt = 0;
        if (self) doLogout(true); else reload();
      } catch (e) { fail(e); }
    };
  }
  $('#sfSave').onclick = async () => {
    const name = $('#sfName').value.trim();
    if (!name) { toast('กรุณาระบุชื่อ', true); return; }
    $('#sfSave').disabled = true;
    try {
      await api('saveStaff', S.token, {
        id: u ? u.id : '', name: name,
        role: self ? u.role : $('#sfRole').value,
        active: self ? true : $('#sfActive').checked
      });
      closeModal();
      toast(u ? 'บันทึกข้อมูลเจ้าหน้าที่แล้ว' : 'เพิ่มเจ้าหน้าที่แล้ว');
      reload();
    } catch (e) { if ($('#sfSave')) $('#sfSave').disabled = false; fail(e); }
  };
}

          ต่ออายุอัตโนมัติทุกครั้งที่ใช้งาน (เครื่องนี้)</label>
        <p class="hint">เปิดแล้วเครื่องนี้จะไม่หลุดตราบที่ยังใช้งานอยู่ · เปิดได้ครั้งละ 1 เครื่องเท่านั้น
          ถ้าไปเปิดที่เครื่องอื่น เครื่องนี้จะถูกปิดให้อัตโนมัติ</p>
      </div>` : '<p class="note warn">ไม่พบข้อมูล session ของเครื่องนี้ (อาจเข้าสู่ระบบก่อนอัปเดตระบบ) — ออกจากระบบแล้วเข้าใหม่เพื่อใช้งานส่วนนี้</p>'}
      <div class="block"><h3>อุปกรณ์ที่เข้าสู่ระบบอยู่ (${d.devices.length})</h3>
        ${d.devices.map(x => `<div class="dev-row">
          <div>${esc(x.device) || 'ไม่ระบุอุปกรณ์'}${x.current ? ' <span class="badge teal">เครื่องนี้</span>' : ''}
            ${x.autoRenew ? ' <span class="badge green">ต่ออายุอัตโนมัติ</span>' : ''}
            <small>ใช้งานล่าสุด ${dtThai(x.lastSeen)}</small></div>
          <div class="num"><b>${dThai(x.expiresAt)}</b><small>หมดอายุ</small></div>
        </div>`).join('')}
      </div>`,
    foot: (others.length ? '<button class="btn danger" id="pfOut">ออกจากระบบอุปกรณ์อื่น (' + others.length + ')</button>' : '') +
      '<button class="btn" data-x>ปิด</button>'
  });
  if ($('#pfAuto')) {
    $('#pfAuto').onchange = async e => {
      const on = e.target.checked;
      e.target.disabled = true;
      try {
        await api('setAutoRenew', S.token, on);
        toast(on ? 'เปิดการต่ออายุอัตโนมัติสำหรับเครื่องนี้แล้ว' : 'ปิดการต่ออายุอัตโนมัติแล้ว');
        openProfile();
      } catch (err) { e.target.disabled = false; e.target.checked = !on; fail(err); }
    };
  }
  if ($('#pfOut')) {
    $('#pfOut').onclick = async () => {
      const btn = $('#pfOut');
      if (!armed(btn, 'กดอีกครั้งเพื่อยืนยัน')) return;
      btn.disabled = true;
      try {
        const n = await api('logoutOtherDevices', S.token);
        toast('ออกจากระบบอุปกรณ์อื่นแล้ว ' + n + ' เครื่อง');
        openProfile();
      } catch (e) { if (btn.isConnected) btn.disabled = false; fail(e); }
    };
  }
}

        <label class="field" style="margin:0;min-width:150px"><select id="wlFilter">
          <option value="">ทุกกระเป๋า</option>${walletOptions(st.filter)}</select></label></div>
      ${rangeBar('wl', st)}
      ${listStamp(st, 'wl')}
      <div class="table-wrap" id="wlTable"></div>
    </div>`;
  const drawCards = () => {
    const box = $('#wlCards');
    if (!box) return;
    if (!S.wlBal) { box.innerHTML = '<p class="note">กำลังโหลดยอดคงเหลือ…</p>'; return; }
    const ws = S.wlBal.wallets;
    const total = ws.reduce((s2, w) => s2 + w.balance, 0);
    box.innerHTML = ws.map(w => `<div class="wallet${w.id === 'TRANSFER' ? ' transfer' : ''}">
        <div class="w-name">กระเป๋า${esc(w.name)}</div>
        <div class="w-bal${w.balance < 0 ? ' neg' : ''}">${money(w.balance)}</div>
        <div class="muted">คำนวณใหม่ล่าสุด ${dtThai(w.updatedAt)}</div>
      </div>`).join('') +
      `<div class="wallet-side">
        <div class="ws-total"><span class="muted">รวมทุกกระเป๋า</span>
          <span class="total${total < 0 ? ' neg' : ''}">${money(total)}</span></div>
        <div class="ws-actions">
          <button class="btn" id="wlTrf">${ICON.transfer}โอนระหว่างกระเป๋า</button>
          ${S.perms.adjust ? `<button class="btn" id="wlAdj">${ICON.adjust}ปรับยอดเงิน</button>` : ''}
        </div>
        <button class="btn ghost sm ws-refresh" id="wlBalRefresh">${ICON.refresh}รีเฟรชยอด</button>
      </div>`;
    $('#wlTrf').onclick = () => transferWalletModal(ws, () => { st.stale = true; S.wlBal.at = 0; renderWallets(el, S.seq); });
    if ($('#wlAdj')) $('#wlAdj').onclick = () => go('adjust');
    $('#wlBalRefresh').onclick = () => loadBalances(false);
  };
  // ยอดคงเหลือ: โหลดครั้งเดียวแล้วแคชไว้ จนกว่าจะมีธุรกรรมใหม่
  const loadBalances = quiet => (quiet ? apiQuiet : api)('getWalletBalances', S.token).then(ws => {
    S.wlBal = { wallets: ws || [], at: Date.now() };
    if (alive(seq)) drawCards();
  }).catch(fail);
  if (!S.wlBal || !cacheFresh(S.wlBal.at, 2 * 60 * 1000)) loadBalances(!!S.wlBal);
  const drawTxns = () => {
    const box = $('#wlTable');
    if (!box) return;
    if (!st.data) { box.innerHTML = listPrompt(); return; }
    const srt = sortState('txns', 'date', 'desc');
    const rows = sorted(st.data.txns.filter(x => !st.filter || x.walletId === st.filter), srt);
    if (!rows.length) { box.innerHTML = '<p class="empty">ไม่มีความเคลื่อนไหวในช่วงนี้</p>'; return; }
    const tin = rows.filter(x => x.amount > 0).reduce((s2, x) => s2 + x.amount, 0);
    const tout = rows.filter(x => x.amount < 0).reduce((s2, x) => s2 + x.amount, 0);
    const ref = x => {
      if (x.refId.indexOf('SAL-') === 0 && S.perms.sale) return `<button class="link" data-sale="${esc(x.refId)}">${esc(x.refId)}</button>`;
      if (x.refId.indexOf('RCV-') === 0 && S.perms.receive) return `<button class="link" data-rcv="${esc(x.refId)}">${esc(x.refId)}</button>`;
      if (x.refId.indexOf('ADJ-') === 0 && S.perms.adjust) return `<button class="link" data-adj="${esc(x.refId)}">${esc(x.refId)}</button>`;
      return esc(x.refId) || '–';
    };
    box.innerHTML = `<table class="tbl">
      <thead><tr><th class="dt" data-k="date" data-d="desc">วันที่-เวลา</th><th class="cm" data-k="type">รายการ</th><th class="hide-m" data-k="walletId">กระเป๋า</th>
        <th class="hide-m" data-k="refId">อ้างอิง</th>
        <th class="num" data-k="amount" data-d="desc">จำนวนเงิน</th><th class="num hide-m">คงเหลือหลังรายการ</th><th class="hide-m" data-k="userName">ผู้ทำรายการ</th></tr></thead>
      <tbody>${rows.map(x => {
        const tt = TXN_TH[x.type] || [x.type, ''];
        return `<tr>
          <td class="dt">${dtCell(x.date)}</td>
          <td class="cm"><span class="badge ${tt[1]}">${esc(tt[0])}</span> ${walletBadge(x.walletId)}
            <span class="sub">${ref(x)}${x.note ? ' · ' + esc(x.note) : ''}</span></td>
          <td class="hide-m">${walletBadge(x.walletId)}</td>
          <td class="id hide-m">${ref(x)}</td>
          <td class="num ${x.amount < 0 ? 'neg' : 'pos'}">${signed(x.amount)}</td>
          <td class="num hide-m">${money(x.balanceAfter)}</td><td class="hide-m">${esc(x.userName)}</td></tr>`;
      }).join('')}</tbody>
      <tfoot><tr><td colspan="2">${rows.length} รายการ<span class="sub">เข้า <span class="pos">${money(tin)}</span> · ออก <span class="neg">${money(Math.abs(tout))}</span></span></td>
        <td class="hide-m" colspan="2"></td>
        <td class="num ${tin + tout < 0 ? 'neg' : 'pos'}">${signed(r2(tin + tout))}</td><td class="hide-m" colspan="2"></td></tr></tfoot>
    </table>`;
    $$('[data-sale]', box).forEach(b => { b.onclick = () => openSaleDetail(b.dataset.sale); });
    $$('[data-rcv]', box).forEach(b => { b.onclick = () => openReceiveById(b.dataset.rcv); });
    $$('[data-adj]', box).forEach(b => { b.onclick = () => openAdjustDetail(b.dataset.adj); });
    makeSortable(box, srt, drawTxns);
  };
  const draw = () => {
    if (!alive(seq)) return;
    if (!$('.list-stamp') && st.rows) { renderWallets(el, seq); return; }
    drawCards();
    drawTxns();
  };
  // getWallets คืน {wallets, txns} — เก็บทั้งก้อน และใช้ txns เป็น rows สำหรับแถบสถานะ
  const load = quiet => (quiet ? apiQuiet : api)('getWallets', S.token, st.from, st.to).then(d => {
    st.data = d;
    S.wlBal = { wallets: d.wallets || [], at: Date.now() };
    st.rows = d.txns || [];
    st.at = nowParts().hour + ':' + nowParts().minute;
    st.stale = false;
    draw();
  }).catch(fail);
  bindRangeBar('wl', st, () => load(false));
  if ($('#wlRefresh')) $('#wlRefresh').onclick = () => load(false);
  $('#wlFilter').onchange = e => { st.filter = e.target.value; drawTxns(); };
  if (st.rows && st.stale) load(true);
  draw();
}

function transferWalletModal(ws, reload) {
  const other = id => (ws.find(w => w.id !== id) || {}).id;
  openModal({
    title: 'โอนเงินระหว่างกระเป๋า',
    body: `<div class="form-grid">
        <label class="field"><span>จากกระเป๋า</span><select id="trFrom">${walletOptions('CASH')}</select></label>
        <label class="field"><span>ไปกระเป๋า</span><select id="trTo" disabled>${walletOptions('TRANSFER')}</select></label>
        <label class="field full"><span>จำนวนเงิน (บาท)</span>
          <input id="trAmt" class="cash-input" type="number" min="0.01" step="0.01" inputmode="decimal"></label>
        <label class="field full"><span>หมายเหตุ</span>
          <input id="trNote" maxlength="200" placeholder="เช่น นำเงินสดฝากเข้าบัญชี"></label>
      </div>
      <p class="hint" id="trHint"></p>`,
    foot: '<button class="btn" data-x>ปิด</button><button class="btn primary" id="trOk">บันทึกการโอน</button>',
    focus: '#trAmt'
  });
  const hint = () => {
    const w = ws.find(x => x.id === $('#trFrom').value);
    $('#trHint').textContent = w ? `ยอดคงเหลือกระเป๋า${w.name}: ${money(w.balance)}` : '';
  };
  $('#trFrom').onchange = e => { $('#trTo').value = other(e.target.value); hint(); };
  hint();
  $('#trOk').onclick = async () => {
    const from = $('#trFrom').value, to = $('#trTo').value, amt = Number($('#trAmt').value);
    if (!(amt > 0)) { toast('จำนวนเงินต้องมากกว่า 0', true); return; }
    try {
      await api('transferWallet', S.token, from, to, amt, $('#trNote').value.trim());
      closeModal();
      toast(`โอน ${money(amt)} จาก${WALLET_TH[from]}ไป${WALLET_TH[to]}แล้ว`);
      reload();
    } catch (e) { fail(e); }
  };
}

/* =====================================================================
 * DASHBOARD
 * ===================================================================== */
let dashReq = 0;

function dashPeriod() {
  const d = S.dash;
  if (d.mode === 'day') {
    return { from: d.day, to: d.day, groupBy: 'hour', label: 'วันที่ ' + dThai(d.day, true) };
  }
  if (d.mode === 'month') {
    const from = `${d.y}-${pad2(d.m)}-01`;
    return { from: from, to: monthEnd(d.y, d.m), groupBy: 'day', label: `${TH_MF[d.m - 1]} ${d.y + 543}` };
  }
  if (d.mode === 'year') {
    return { from: `${d.y}-01-01`, to: `${d.y}-12-31`, groupBy: 'month', label: `ปี ${d.y + 543}` };
  }
  const days = daysDiff(d.from, d.to);
  return { from: d.from, to: d.to, groupBy: days > 62 ? 'month' : 'day',
    label: `${dThai(d.from, true)} – ${dThai(d.to, true)} (${days + 1} วัน)` };
}

function renderDashboard(el, seq) {
  const t = todayYmd();
  if (!S.dash) S.dash = { mode: 'day', day: t, y: +t.slice(0, 4), m: +t.slice(5, 7), from: ymdAdd(t, -6), to: t };
  el.innerHTML = `<div class="toolbar dash-bar">
      <div class="seg four" id="dMode">${[['day', 'รายวัน'], ['month', 'รายเดือน'], ['year', 'รายปี'], ['range', 'ช่วงวัน']]
        .map(x => `<button type="button" data-m="${x[0]}">${x[1]}</button>`).join('')}</div>
      <div class="inline" id="dCtrl"></div>
      <button type="button" class="btn primary" id="dShow">แสดงผล</button>
    </div>
    <div id="dashBody"></div>`;
  $$('#dMode button').forEach(b => {
    b.onclick = () => { S.dash.mode = b.dataset.m; ctrl(); };
  });
  $('#dShow').onclick = () => load(false);

  function yearOptions(sel) {
    const cy = +todayYmd().slice(0, 4);
    const ys = [];
    for (let y = Math.max(cy + 1, sel); y >= Math.min(cy - 5, sel); y--) ys.push(y);
    return ys.map(y => `<option value="${y}"${y === sel ? ' selected' : ''}>${y + 543}</option>`).join('');
  }

  function ctrl() {
    const d = S.dash, box = $('#dCtrl');
    $$('#dMode button').forEach(b => b.classList.toggle('on', b.dataset.m === d.mode));
    const nav = '<button class="btn" data-step="-1" aria-label="ก่อนหน้า">‹</button><button class="btn" data-step="1" aria-label="ถัดไป">›</button>';
    if (d.mode === 'day') {
      box.innerHTML = `<label class="field"><span>วันที่</span><input type="date" id="dDay" value="${d.day}"></label>
        ${nav}<button class="btn ghost" id="dToday">วันนี้</button>`;
      $('#dDay').onchange = e => { if (e.target.value) d.day = e.target.value; };
      $('#dToday').onclick = () => { d.day = todayYmd(); ctrl(); load(false); };
    } else if (d.mode === 'month') {
      box.innerHTML = `<label class="field"><span>เดือน</span><select id="dMonth">${TH_MF.map((n, i) =>
          `<option value="${i + 1}"${i + 1 === d.m ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
        <label class="field"><span>ปี</span><select id="dYear">${yearOptions(d.y)}</select></label>${nav}`;
      $('#dMonth').onchange = e => { d.m = +e.target.value; };
      $('#dYear').onchange = e => { d.y = +e.target.value; };
    } else if (d.mode === 'year') {
      box.innerHTML = `<label class="field"><span>ปี</span><select id="dYear">${yearOptions(d.y)}</select></label>${nav}`;
      $('#dYear').onchange = e => { d.y = +e.target.value; };
    } else {
      box.innerHTML = `<label class="field"><span>ตั้งแต่</span><input type="date" id="dFrom" value="${d.from}"></label>
        <label class="field"><span>ถึง</span><input type="date" id="dTo" value="${d.to}"></label>
        <button class="btn ghost" data-last="7">7 วัน</button><button class="btn ghost" data-last="30">30 วัน</button>`;
      $('#dFrom').onchange = e => { d.from = e.target.value; };
      $('#dTo').onchange = e => { d.to = e.target.value; };
      $$('[data-last]', box).forEach(b => {
        b.onclick = () => { d.to = todayYmd(); d.from = ymdAdd(d.to, -(+b.dataset.last - 1)); ctrl(); load(false); };
      });
    }
    $$('[data-step]', box).forEach(b => {
      b.onclick = () => {
        const s = +b.dataset.step;
        if (d.mode === 'day') d.day = ymdAdd(d.day, s);
        else if (d.mode === 'year') d.y += s;
        else {
          d.m += s;
          if (d.m < 1) { d.m = 12; d.y--; }
          if (d.m > 12) { d.m = 1; d.y++; }
        }
        ctrl();
        load(false);
      };
    });
  }

  function load(quiet) {
    const p = dashPeriod();
    if (!p.from || !p.to) { toast('กรุณาเลือกวันที่ให้ครบ', true); return; }
    if (p.from > p.to) { toast('วันที่เริ่มต้องไม่เกินวันที่สิ้นสุด', true); return; }
    const my = ++dashReq;
    (quiet ? apiQuiet : api)('getDashboard', S.token, p.from, p.to, p.groupBy).then(d => {
      if (!alive(seq) || my !== dashReq) return;
      S.dash.result = { d: d, p: p, at: nowParts().hour + ':' + nowParts().minute };
      S.dash.stale = false;
      drawDashboard(d, p, S.dash.result.at);
    }).catch(fail);
  }

  ctrl();
  if (S.dash.result) {
    drawDashboard(S.dash.result.d, S.dash.result.p, S.dash.result.at);
    if (S.dash.stale) load(true);     // มีการขาย/รับ/ปรับยอดหลังดูครั้งก่อน → อัปเดตเงียบ ๆ
  } else {
    $('#dashBody').innerHTML = listPrompt('เลือกช่วงเวลาด้านบน แล้วกด “แสดงผล” (หรือกด วันนี้ / 7 วัน / 30 วัน)');
  }
}

function drawDashboard(d, p, at) {
  const box = $('#dashBody');
  if (!box) return;
  const s = d.summary;
  const cashPct = s.revenue ? s.cash / s.revenue * 100 : 0;
  const unit = { hour: 'ชั่วโมง', day: 'วัน', month: 'เดือน' }[d.groupBy];
  const maxRev = Math.max(1, ...d.series.map(x => x.revenue));
  const lab = k => d.groupBy === 'hour' ? k : d.groupBy === 'month' ? TH_M[+k.slice(5, 7) - 1] : String(+k.slice(8, 10));
  const full = k => d.groupBy === 'hour' ? `${k}:00–${k}:59` : d.groupBy === 'month'
    ? `${TH_MF[+k.slice(5, 7) - 1]} ${+k.slice(0, 4) + 543}` : dThai(k, true);
  const lim = (arr, fn, n) => {
    n = n || 8;
    return arr.slice(0, n).map(fn).join('') +
      (arr.length > n ? `<div class="alert-item"><small>และอีก ${arr.length - n} รายการ</small></div>` : '');
  };

  const chart = s.revenue ? `<div class="chart">${d.series.map(x => {
      const pr = x.revenue ? Math.max(0, Math.min(100, x.profit / x.revenue * 100)) : 0;
      const tip = `${full(x.key)} · รายรับ ${money(x.revenue)} · กำไร ${money(x.profit)} · ${x.bills} บิล`;
      return `<div class="bar-col" title="${esc(tip)}">
        <div class="bar-stack"><div class="bar-rev" style="height:${x.revenue / maxRev * 100}%"><div class="bar-pro" style="height:${pr}%"></div></div></div>
        <label>${esc(lab(x.key))}</label></div>`;
    }).join('')}</div><p class="hint">แท่งสูงสุด ${money(maxRev)} ต่อ${unit} · ชี้ที่แท่งเพื่อดูรายละเอียด</p>`
    : '<p class="empty">ยังไม่มียอดขายในช่วงนี้</p>';

  const srtP = sortState('dashProducts', 'revenue', 'desc');
  const srtR = sortState('dashPresenters', 'revenue', 'desc');
  const prodTable = d.products.length ? `<div class="table-wrap" id="dashProd"><table class="tbl">
      <thead><tr><th data-k="name">สินค้า</th><th class="num" data-k="qty" data-d="desc">จำนวน</th><th class="num" data-k="revenue" data-d="desc">รายรับ</th>
        <th class="num" data-k="cost" data-d="desc">ต้นทุน</th><th class="num" data-k="profit" data-d="desc">กำไร</th><th class="num">% กำไร</th></tr></thead>
      <tbody>${sorted(d.products, srtP).map(x => `<tr><td>${esc(x.name)}</td><td class="num">${nf(x.qty)}</td>
        <td class="num">${money(x.revenue)}</td><td class="num">${money(x.cost)}</td>
        <td class="num${x.profit < 0 ? ' neg' : ''}">${money(x.profit)}</td><td class="num">${pctTxt(x.profit, x.revenue)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>รวม</td><td class="num">${nf(s.qty)}</td><td class="num">${money(s.revenue)}</td>
        <td class="num">${money(s.cost)}</td><td class="num${s.profit < 0 ? ' neg' : ''}">${money(s.profit)}</td>
        <td class="num">${pctTxt(s.profit, s.revenue)}</td></tr></tfoot>
    </table></div>` : '<p class="empty">ไม่มีรายการขาย</p>';

  const presTable = (d.presenters || []).length ? `<div class="table-wrap" id="dashPres"><table class="tbl">
      <thead><tr><th data-k="name">ผู้เสนอขาย</th><th class="num" data-k="bills" data-d="desc">บิล</th>
        <th class="num" data-k="revenue" data-d="desc">ยอดขาย</th><th class="num" data-k="profit" data-d="desc">กำไร</th></tr></thead>
      <tbody>${sorted(d.presenters, srtR).map(x => `<tr><td>${esc(x.name)}</td><td class="num">${nf(x.bills)}</td>
        <td class="num">${money(x.revenue)}</td><td class="num${x.profit < 0 ? ' neg' : ''}">${money(x.profit)}</td></tr>`).join('')}</tbody>
    </table></div>` : '<p class="muted">ยังไม่มีข้อมูลผู้เสนอขาย</p>';

  const low = d.lowStock.length ? lim(d.lowStock, x => `<div class="alert-item">
      <div>${esc(x.name)}<small>Min ${nf(x.min)}${x.max > x.stock ? ' · ควรสั่งเพิ่ม ' + nf(x.max - x.stock) : ''}</small></div>
      <span><span class="badge ${x.stock <= 0 ? 'red' : 'amber'}">เหลือ ${nf(x.stock)}${x.unit ? ' ' + esc(x.unit) : ''}</span></span>
    </div>`) : '<p class="muted">สต็อกทุกรายการอยู่ในเกณฑ์</p>';

  const wallets = d.wallets ? `<div class="card">
      <div class="card-head"><h3>ยอดในกระเป๋าตอนนี้</h3><button class="btn sm ghost" id="dWl">จัดการ</button></div>
      <div class="alert-list">${d.wallets.map(w => `<div class="alert-item"><div>${walletBadge(w.id)}</div>
        <b class="num${w.balance < 0 ? ' neg' : ''}">${money(w.balance)}</b></div>`).join('')}</div>
    </div>` : '';

  box.innerHTML = `<p class="dash-period">${esc(p.label)}${at ? ` <span class="muted">· ข้อมูล ณ ${at}</span>` : ''}</p>
    <div class="kpis">
      <div class="kpi hero">
        <div><span>รายรับรวม</span><strong>${money(s.revenue)}</strong>
          <small>${nf(s.bills)} บิล · ${nf(s.qty)} ชิ้น</small></div>
        <div>
          <div class="split-bar"><i style="width:${cashPct}%;background:#7FD1C9"></i><i style="width:${s.revenue ? 100 - cashPct : 0}%;background:#8FB3E8"></i></div>
          <div class="split-legend">
            <span><i class="dot" style="background:#7FD1C9"></i>เงินสด <b>${pctTxt(s.cash, s.revenue)}</b></span>
            <span><i class="dot" style="background:#8FB3E8"></i>เงินโอน <b>${pctTxt(s.transfer, s.revenue)}</b></span>
          </div>
        </div>
      </div>
      <div class="kpi"><span>รายรับเงินสด</span><strong>${money(s.cash)}</strong><small>${pctTxt(s.cash, s.revenue)} ของรายรับ</small></div>
      <div class="kpi"><span>รายรับเงินโอน</span><strong>${money(s.transfer)}</strong><small>${pctTxt(s.transfer, s.revenue)} ของรายรับ</small></div>
      <div class="kpi"><span>กำไรขั้นต้น</span><strong class="${s.profit < 0 ? 'neg' : 'pos'}">${money(s.profit)}</strong>
        <small>อัตรากำไร ${pctTxt(s.profit, s.revenue)}</small></div>
      <div class="kpi"><span>ต้นทุนสินค้าที่ขาย</span><strong>${money(s.cost)}</strong><small>คิดตามต้นทุน Lot (FIFO)</small></div>
      <div class="kpi"><span>ซื้อสินค้าเข้า</span><strong>${money(s.purchase)}</strong>
        <small>${s.purchaseUnpaid ? 'ค้างจ่าย/รอเบิก ' + money(s.purchaseUnpaid) : 'ชำระครบแล้ว'}</small></div>
      <div class="kpi"><span>ปรับยอดเงิน</span><strong class="${s.adjustIn - s.adjustOut < 0 ? 'neg' : ''}">${signed(r2(s.adjustIn - s.adjustOut))}</strong>
        <small>เข้า ${money(s.adjustIn)} · ออก ${money(s.adjustOut)}</small></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>รายรับและกำไร ราย${unit}</h3>
        <div class="legend">
          <span><i class="dot" style="background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal-2)"></i>รายรับ</span>
          <span><i class="dot" style="background:var(--teal)"></i>กำไร</span>
        </div></div>
      ${chart}
    </div>
    <div class="dash-grid">
      <div class="card">
        <div class="card-head"><h3>สรุปตามรายการสินค้า</h3><span class="muted">${d.products.length} รายการ</span></div>
        ${prodTable}
        <div class="card-head" style="margin-top:20px"><h3>ยอดขายตามผู้เสนอขาย</h3></div>
        ${presTable}
      </div>
      <div>
        <div class="card">
          <div class="card-head"><h3>ต่ำกว่า Min Stock</h3><span class="badge ${d.lowStock.length ? 'amber' : 'green'}">${d.lowStock.length}</span></div>
          <div class="alert-list">${low}</div>
        </div>
        ${wallets}
      </div>
    </div>`;
  const wl = $('#dWl');
  if (wl) wl.onclick = () => go('wallets');
  if ($('#dashProd')) makeSortable($('#dashProd'), srtP, () => drawDashboard(d, p, at));
  if ($('#dashPres')) makeSortable($('#dashPres'), srtR, () => drawDashboard(d, p, at));
}

window.__MOLA_JS_OK = true;
const verEl = document.getElementById('appVer');
if (verEl) verEl.textContent = APP_VERSION;

try {
  boot();
} catch (e) {
  if (window.__molaShowBootError) {
    window.__molaShowBootError('เริ่มระบบไม่สำเร็จ: ' + ((e && e.message) || e));
  }
}

window.__MOLA_PART3 = true;
</script>
