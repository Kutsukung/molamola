<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MolaMola Care</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MolaMola Care">
  <meta name="theme-color" content="#0A7C82">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    /* หน้าตัวโหลด — แสดงระหว่างดึงโค้ดแอปจาก Apps Script ครั้งแรก */
    html, body { margin: 0; min-height: 100%; }
    body { font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; background: #EEF8F9; color: #15363E; }
    #ldr { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
    #ldr .logo { width: 84px; height: 84px; border-radius: 50%; background: #DCF3F4 url(apple-touch-icon.png) center / cover no-repeat; box-shadow: 0 10px 28px -14px rgba(11,76,83,.4); }
    #ldr h1 { font: 500 1.25rem 'Mitr', 'IBM Plex Sans Thai', sans-serif; margin: 6px 0 0; color: #0A7C82; }
    #ldr p { margin: 0; font-size: .9375rem; color: #3D5E66; }
    #ldr .spin { width: 28px; height: 28px; border: 3px solid #CDE5E8; border-top-color: #0A7C82; border-radius: 50%; animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    #ldr .err { max-width: 420px; background: #FDE6E3; color: #C0443D; border-radius: 12px; padding: 12px 14px; font-size: .9rem; line-height: 1.5; }
    #ldr button { margin-top: 4px; padding: 10px 18px; border-radius: 10px; border: 1px solid #0A7C82; background: #0A7C82; color: #fff; font: inherit; font-size: 1rem; cursor: pointer; }
    #ldr small { color: #6E8A91; font-size: .75rem; }
  </style>
</head>
<body>
  <div id="ldr">
    <div class="logo"></div>
    <h1>MolaMola Care</h1>
    <div class="spin" id="ldrSpin"></div>
    <p id="ldrMsg">กำลังเตรียมแอป…</p>
  </div>
  <script>
  /* ตัวโหลด: ดึงโค้ดแอปตัวจริงจาก Apps Script (ลิงก์ใน config.js) เก็บไว้ในเครื่อง
     เปิดครั้งถัดไปเช็กแค่เลขเวอร์ชัน ถ้าไม่เปลี่ยนใช้ของในเครื่องทันที ถ้าเปลี่ยนจึงดาวน์โหลดใหม่
     ไฟล์นี้ไม่ต้องอัปเดตอีกเมื่อแอปเปลี่ยน — อัปเดตที่ Apps Script ที่เดียว */
  (function () {
    var API = String(window.MOLA_API_URL || '').trim();
    var KEY = 'mola_app_bundle';
    var msg = document.getElementById('ldrMsg');
    var spin = document.getElementById('ldrSpin');

    function say(t) { if (msg) msg.textContent = t; }
    function fail(text) {
      if (spin) spin.style.display = 'none';
      var box = document.getElementById('ldr');
      box.innerHTML = '<div class="logo"></div><h1>MolaMola Care</h1><div class="err">' + text + '</div>' +
        '<button onclick="location.reload()">ลองใหม่</button><small>ถ้ายังไม่ได้ ให้ตรวจอินเทอร์เน็ต หรือลิงก์ API ใน config.js</small>';
    }
    function getJson(url) {
      return fetch(url, { cache: 'no-store', credentials: 'omit', redirect: 'follow' })
        .then(function (r) { return r.text(); })
        .then(function (t) { var j = null; try { j = JSON.parse(t); } catch (e) { j = null; }
          if (!j || !j.ok) throw new Error(j && j.error ? j.error : 'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง'); return j; });
    }
    function readCache() { try { var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
    function writeCache(b) { try { localStorage.setItem(KEY, JSON.stringify(b)); } catch (e) { /* เต็มหรือปิดอยู่ ก็ยังใช้งานได้ */ } }
    function stripTag(html, tag) {
      // เอาเนื้อหาภายใน <tag>...</tag> (ไฟล์ Js/Css ของ Apps Script ห่อด้วยแท็กไว้)
      var open = html.indexOf('<' + tag), close = html.lastIndexOf('</' + tag + '>');
      if (open < 0 || close < 0) return html;
      return html.slice(html.indexOf('>', open) + 1, close);
    }
    function mount(b) {
      var head = document.head;
      var st = document.createElement('style'); st.textContent = stripTag(b.css || '', 'style'); head.appendChild(st);
      if (b.brand) { var bs = document.createElement('style'); bs.textContent = stripTag(b.brand, 'style'); head.appendChild(bs); }
      document.body.innerHTML = b.body || '';
      (b.scripts || []).forEach(function (code, i) {
        var sc = document.createElement('script');
        sc.textContent = stripTag(code, 'script') + String.fromCharCode(10) + '//# sourceURL=molamola-js' + (i + 1) + '.js';
        document.body.appendChild(sc);
      });
      setTimeout(function () {
        if (!window.__MOLA_JS_OK) {
          document.body.innerHTML = '';
          document.body.appendChild(Object.assign(document.createElement('div'), { id: 'ldr' }));
          fail('โค้ดแอปทำงานไม่สำเร็จ (' + (b.version || '?') + ') — ลองใหม่อีกครั้ง หรือรัน Deploy เวอร์ชันใหม่ใน Apps Script');
        }
      }, 5000);
    }

    // แถบแจ้งว่ามีเวอร์ชันใหม่ดาวน์โหลดไว้แล้ว แตะเพื่อเปิดใช้ (ไม่บังคับ เพื่อไม่ให้สะดุดงานที่กำลังทำ)
    function offerUpdate(ver) {
      var bar = document.createElement('button');
      bar.id = 'molaUpdateBar';
      bar.textContent = 'มีเวอร์ชันใหม่ ' + ver + ' พร้อมใช้ · แตะเพื่อโหลด';
      bar.setAttribute('style', 'position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);' +
        'z-index:9999;padding:10px 16px;border:0;border-radius:999px;background:#0A7C82;color:#fff;font:inherit;font-size:.9rem;' +
        'box-shadow:0 10px 28px -10px rgba(11,76,83,.6);cursor:pointer;max-width:92vw');
      bar.onclick = function () { location.reload(); };
      document.body.appendChild(bar);
    }

    if (!API) { fail('ยังไม่ได้ตั้งลิงก์ API ใน config.js'); return; }
    var cached = readCache();
    if (cached && cached.scripts) {
      // มีของในเครื่อง: เปิดทันที แล้วค่อยเช็กเวอร์ชันเบื้องหลัง ถ้ามีใหม่ให้เตรียมไว้ใช้ครั้งถัดไป
      mount(cached);
      getJson(API + '?asset=version').then(function (v) {
        if (v.version && v.version !== cached.version) {
          return getJson(API + '?asset=app').then(function (b) { writeCache(b); offerUpdate(b.version); });
        }
      }).catch(function () { /* ออฟไลน์ก็ใช้ของเดิมต่อได้ */ });
      return;
    }
    say('กำลังดาวน์โหลดแอปครั้งแรก…');
    getJson(API + '?asset=app').then(function (b) { writeCache(b); mount(b); })
      .catch(function (e) { fail('ดาวน์โหลดแอปไม่สำเร็จ: ' + (e && e.message ? e.message : e)); });
  })();
  </script>
</body>
</html>
