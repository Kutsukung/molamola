<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MolaMola Care</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MolaMola Care">
  <meta name="theme-color" content="#0A7C82">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <base target="_top">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
:root {
  /* โทนสีจากแบนเนอร์ MolaMola Care */
  --ink: #15363E;          /* ตัวอักษรหลัก: น้ำเงินอมเขียวเข้ม */
  --ink-2: #3D5E66;
  --muted: #6E8A91;
  --paper: #EEF8F9;        /* พื้นหลังฟ้าอมเขียวอ่อน */
  --surface: #FFFFFF;
  --line: #CDE5E8;
  --line-soft: #E1F1F3;
  --teal: #0A7C82;         /* สีตัวอักษร "MolaMola" */
  --teal-2: #1FA3A6;       /* สีตัวอักษร "Care" / เสื้อมาสคอต */
  --teal-soft: #DCF3F4;
  --deep: #0B4C53;         /* แถบเมนู */
  --sun: #FED25A;          /* ประกายสีเหลือง */
  --blush: #FCA8A2;        /* หัวใจ/แก้มชมพู */
  --amber: #B7791F;
  --amber-soft: #FFF3D1;
  --red: #C0443D;
  --red-soft: #FDE6E3;
  --green: #2E7D50;
  --green-soft: #E1F3E7;
  --blue: #2F68A8;
  --blue-soft: #E3EEF9;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(11, 76, 83, .06), 0 10px 28px -14px rgba(11, 76, 83, .22);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'IBM Plex Sans Thai', 'Sarabun', 'Tahoma', sans-serif;
  font-size: 15px; line-height: 1.55; color: var(--ink); background: var(--paper);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; line-height: 1.3; font-weight: 500; font-family: 'Mitr', 'IBM Plex Sans Thai', sans-serif; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--muted); font-size: .875rem; }
.num, .money { font-variant-numeric: tabular-nums; }
.pos { color: var(--green); }
.neg { color: var(--red); }
.grow { flex: 1; }

button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal-2); outline-offset: 2px; }

input, select, textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); min-height: 40px;
}
input:focus, select:focus, textarea:focus { border-color: var(--teal-2); outline: none; box-shadow: 0 0 0 3px var(--teal-soft); }
input:disabled, select:disabled { background: var(--paper); color: var(--muted); }
input[type="number"] { text-align: right; font-variant-numeric: tabular-nums; }
input[type="checkbox"] { width: 18px; height: 18px; min-height: 0; accent-color: var(--teal); }
input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; max-width: 100%; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; }
.field { min-width: 0; }

label.field, .field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: .8125rem; color: var(--ink-2); font-weight: 500; }
.chk { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap;
  transition: background .12s, border-color .12s;
}
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--teal-2); }
.btn.danger { color: var(--red); border-color: #E7B9B5; }
.btn.danger:hover { background: var(--red-soft); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--teal); }
.btn.ghost:hover { background: var(--teal-soft); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: .875rem; }
.btn.lg { min-height: 48px; padding: 10px 24px; font-size: 1.0625rem; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent;
  color: var(--muted); cursor: pointer; font-size: 1rem;
}
.icon-btn:hover:not(:disabled) { background: var(--red-soft); color: var(--red); }
.icon-btn:disabled { opacity: .3; cursor: not-allowed; }

/* ---------- badges ---------- */
.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .78rem;
  font-weight: 500; background: var(--line-soft); color: var(--ink-2); white-space: nowrap;
}
.badge.teal { background: var(--teal-soft); color: var(--teal); }
.badge.green { background: var(--green-soft); color: var(--green); }
.badge.amber { background: var(--amber-soft); color: var(--amber); }
.badge.red { background: var(--red-soft); color: var(--red); }
.badge.blue { background: var(--blue-soft); color: var(--blue); }

/* ---------- login ---------- */
.login {
  min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background:
    radial-gradient(ellipse 60% 45% at 85% 10%, rgba(31, 163, 166, .16), transparent 70%),
    radial-gradient(ellipse 55% 40% at 10% 95%, rgba(31, 163, 166, .14), transparent 70%),
    linear-gradient(180deg, #F6FCFC 0%, var(--paper) 100%);
}
.login-card {
  width: min(440px, 100%); background: var(--surface); border-radius: 20px; overflow: hidden;
  box-shadow: var(--shadow); padding: 28px 26px 24px; display: flex; flex-direction: column; gap: 20px;
}
.brand-banner, .brand-avatar, .brand-only { display: none; }
.brand-banner { margin: -28px -26px 0; aspect-ratio: 3 / 1; background: center / cover no-repeat;
  border-bottom: 1px solid var(--line-soft); }
.login-tagline { text-align: center; color: var(--ink-2); font-size: .9375rem; margin-top: -8px; }
.brand-avatar { width: 38px; height: 38px; flex: none; border-radius: 50%; background: #CEF4F6 center / cover no-repeat;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); }
.login-brand { display: flex; align-items: center; gap: 14px; }
.login-brand h1 { font-size: 1.375rem; letter-spacing: -.01em; }
.login-brand p { color: var(--muted); font-size: .875rem; }
.tooth { width: 48px; height: 48px; color: var(--teal); flex: none; }
.tooth.sm { width: 26px; height: 26px; color: #8FE3E4; }

.pin-stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pin-title { font-weight: 600; }
.pin-dots { display: flex; gap: 14px; padding: 4px 0; }
.pin-dots i {
  width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink-2);
  transition: background .12s, transform .12s;
}
.pin-dots i.on { background: var(--teal); border-color: var(--teal); transform: scale(1.08); }
.pin-dots.working i { border-color: var(--teal); background: var(--teal); animation: pulse .8s infinite alternate; }
.pin-dots.shake { animation: shake .35s; }
.pin-dots.shake i { border-color: var(--red); }
.pin-msg { min-height: 1.4em; font-size: .875rem; color: var(--red); text-align: center; }
.pin-msg.info { color: var(--teal); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.keypad button {
  height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  font-size: 1.375rem; font-weight: 500; cursor: pointer; font-variant-numeric: tabular-nums;
}
.keypad button:active { background: var(--teal-soft); border-color: var(--teal-2); }
.keypad .k-soft { font-size: 1.05rem; color: var(--ink-2); background: var(--paper); }
.keypad .k-ic { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; margin: 0 auto; }

@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes pulse { from { opacity: .4; } to { opacity: 1; } }

/* ---------- app shell ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 248px; flex: none; background: linear-gradient(180deg, #0D5960 0%, var(--deep) 100%); color: #C9E4E7;
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 30;
}
.side-brand {
  display: flex; align-items: center; gap: 10px; padding: 20px 20px 18px;
  color: #fff; font-weight: 500; font-size: 1.125rem; font-family: 'Mitr', 'IBM Plex Sans Thai', sans-serif;
}
.nav { flex: 1; overflow-y: auto; padding: 4px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; color: inherit;
  cursor: pointer; position: relative;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: rgba(143,227,228,.16); color: #fff; }
.nav-item.active::before {
  content: ''; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px;
  border-radius: 0 3px 3px 0; background: #8FE3E4;
}
.nav-item.sub { padding-left: 40px; font-size: .9375rem; }
.nav-group { margin-top: 10px; }
.nav-label { display: flex; align-items: center; gap: 10px; padding: 6px 12px; color: #9CC3C7; font-size: .875rem; }
.side-user {
  border-top: 1px solid rgba(255,255,255,.08); padding: 14px 18px 18px;
  display: flex; flex-direction: column; gap: 10px;
}
.side-user strong { display: block; color: #fff; font-weight: 500; }
.side-user span { font-size: .8125rem; color: #9CC3C7; }
.btn-logout {
  border: 1px solid rgba(255,255,255,.16); background: transparent; color: #DCE6EA;
  border-radius: 8px; padding: 7px; cursor: pointer;
}
.btn-logout:hover { background: rgba(255,255,255,.06); }
.scrim { display: none; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 12px; padding: 14px 28px;
  background: var(--paper); position: sticky; top: 0; z-index: 10;
  border-bottom: 1px solid var(--line-soft);
}
.topbar h1 { font-size: 1.25rem; }
.page-id { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.page-icon { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center;
  background: var(--page, var(--teal)); color: #fff; box-shadow: 0 4px 10px -4px var(--page, var(--teal)); }
.page-icon svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.page-id.bump { animation: bump .35s ease-out; }
@keyframes bump { 0% { transform: translateX(-10px); opacity: .3; } 100% { transform: none; opacity: 1; } }
.view.enter { animation: viewin .28s ease-out; }
@keyframes viewin { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: none; } }
body[data-page="sale"] { --page: var(--teal); }
body[data-page="receive"] { --page: var(--blue); }
body[data-page="adjust"] { --page: var(--amber); }
body[data-page="database"] { --page: var(--deep); }
body[data-page="dashboard"] { --page: #2E7D50; }
.topbar { border-top: 4px solid var(--page, var(--teal)); }
.top-clock { color: var(--ink-2); font-size: .875rem; white-space: nowrap; }
.top-clock b { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.hamburger { display: none; border: 0; background: transparent; padding: 6px; cursor: pointer; }
.hamburger svg { width: 24px; height: 24px; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.view { padding: 22px 28px 48px; max-width: 1360px; width: 100%; }

/* ---------- generic card / toolbar / table ---------- */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
.card + .card { margin-top: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-bottom: 16px; }
.toolbar .field { min-width: 150px; }
.toolbar input[type="search"] { max-width: 320px; }
.note {
  background: var(--teal-soft); color: var(--teal); border-radius: 8px;
  padding: 10px 14px; font-size: .875rem; margin-bottom: 14px;
}
.note.warn { background: var(--amber-soft); color: var(--amber); }

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th {
  text-align: left; font-weight: 500; color: var(--muted); font-size: .8125rem;
  padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
  position: sticky; top: 0; background: var(--surface);
}
.tbl td { padding: 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover { background: #F6FAFA; }
.tbl tfoot td { font-weight: 600; border-top: 1px solid var(--line); }
.tbl .id { font-size: .8rem; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl tr.dim td { color: var(--muted); }
.only-m { display: none; }   /* แสดงเฉพาะจอแคบ (เปิดใน media query ด้านล่าง) */
/* ---------- ไอคอนในปุ่ม ---------- */
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  vertical-align: -3px; margin-right: 6px; flex: none; }
.btn .ic { display: inline-block; }
.btn.sm .ic { width: 14px; height: 14px; margin-right: 4px; }

/* ---------- กระเป๋าเงิน: ยอดรวม + ปุ่ม ---------- */
.wallet-side { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.ws-total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ws-actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
.ws-actions .btn { justify-content: center; }
.ws-refresh { align-self: flex-start; }

/* ---------- หัวคอลัมน์ที่กดเรียงได้ ---------- */
.tbl th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
.tbl th.sortable::after { content: '↕'; margin-left: 5px; opacity: .35; font-size: .75em; }
.tbl th.sortable.asc::after { content: '↑'; opacity: 1; color: var(--teal); }
.tbl th.sortable.desc::after { content: '↓'; opacity: 1; color: var(--teal); }
.tbl th.sortable:hover { color: var(--teal); }

/* ---------- ตารางลิสท์: คอลัมน์หลัก / วันที่ / เลขย่อ ---------- */
.tbl td.dt, .tbl th.dt { white-space: nowrap; }
.tbl td.cm { min-width: 200px; }
.tbl td.wrap { white-space: normal; min-width: 120px; }
.tbl td.dt .sub { margin-top: 0; }
.tbl .sub { display: block; font-size: .75rem; color: var(--muted); font-weight: 400; line-height: 1.5; margin-top: 2px; }
.tbl .sub .link { font-size: inherit; }
.tbl td.actions-cell { white-space: nowrap; }


.empty { text-align: center; color: var(--muted); padding: 32px 12px; }
.actions-cell { white-space: nowrap; text-align: right; }

.meter { height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; min-width: 70px; }
.meter > span { display: block; height: 100%; background: var(--teal-2); }

/* ---------- sale: receipt ---------- */
.sale-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.receipt {
  position: relative; background: var(--surface); border-radius: 6px 6px 0 0;
  box-shadow: var(--shadow); padding: 22px 22px 26px; margin-bottom: 14px;
}
.receipt::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px;
  background:
    linear-gradient(135deg, var(--surface) 50%, transparent 50%) 0 0 / 14px 10px repeat-x,
    linear-gradient(-135deg, var(--surface) 50%, transparent 50%) 0 0 / 14px 10px repeat-x;
  filter: drop-shadow(0 3px 2px rgba(11,76,83,.06));
}
.receipt-head, .sheet-head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  padding-bottom: 14px; border-bottom: 1px dashed var(--line); margin-bottom: 8px;
}
.stamp { text-align: right; color: var(--ink-2); font-size: .875rem; }
.stamp .clock { font-size: 1.5rem; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.2; }

.lines, .rlines { display: flex; flex-direction: column; }
.lines { container: salelines / inline-size; }
.rlines { container: recvlines / inline-size; }
.line, .rline {
  display: grid; gap: 10px; align-items: center; padding: 10px 0;
  border-bottom: 1px solid var(--line-soft);
}
.line { grid-template-columns: minmax(190px, 2.4fr) 120px 84px 116px 128px 36px; }
.rline { grid-template-columns: minmax(170px, 1.9fr) 110px 76px 100px 96px 104px 108px 36px; }
.uline { display: grid; gap: 10px; align-items: center; padding: 8px 0;
  border-bottom: 1px solid var(--line-soft); grid-template-columns: minmax(120px, 1fr) 220px 120px 56px 36px; }
.uline .c { text-align: center; align-items: center; }
/* แถวหน่วยขาย: จัดชิดบนทุกช่อง ให้กล่องกรอกอยู่แนวเดียวกัน (ข้อความ "= 48 ชิ้น" อยู่ใต้กล่องโดยไม่ดันช่องอื่น) */
.uline:not(.line-head):not(.base-row) { align-items: start; }
.uline:not(.line-head):not(.base-row) > .cell.c,
.uline:not(.line-head):not(.base-row) > .icon-btn { min-height: 40px; display: flex; align-items: center; justify-content: center; align-self: start; }
.uline .c input[type="checkbox"] { width: 18px; height: 18px; margin: 0 auto; }
.u-eq { display: flex; gap: 6px; }
.u-eq input { width: 72px; flex: none; }
.u-eq select { flex: 1; min-width: 0; }
.u-eq-note { display: block; font-size: .75rem; color: var(--muted); margin-top: 2px; }
.u-eq-note.err { color: var(--red); }
.uline.buy-only { background: repeating-linear-gradient(135deg, transparent 0 8px, var(--paper) 8px 16px); border-radius: 8px; }
.uline.line-head { color: var(--muted); font-size: .8125rem; padding: 6px 0; border: 0; }
.gift { font-size: .75rem; }
.aline { display: grid; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-soft);
  grid-template-columns: minmax(200px, 2fr) 136px 96px 120px 36px; }
.aline.line-head { color: var(--muted); font-size: .8125rem; padding: 6px 0; }
.aline .meta { grid-column: 1 / -1; }
.rline .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; padding-left: 2px; }
.rline .meta > label { flex: 1 1 170px; }
.line-head { color: var(--muted); font-size: .8125rem; padding: 6px 0; }
.line-head .r { text-align: right; }
.cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cell.num { text-align: right; align-items: flex-end; }
.cell .cap { display: none; font-size: .75rem; color: var(--muted); }
.alloc { font-size: .75rem; color: var(--muted); line-height: 1.35; min-height: 1em; }
.alloc.err { color: var(--red); font-weight: 500; }
.lot-tag { font-size: .75rem; color: var(--teal); }
.rline.deleted { opacity: .45; }
.rline.deleted input, .rline.deleted select { text-decoration: line-through; }

.receipt-foot {
  margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line);
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px;
}
.subtotals { display: flex; gap: 22px; color: var(--ink-2); font-size: .875rem; }
.subtotals b { display: block; font-size: 1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.grand { text-align: right; }
.grand span { color: var(--ink-2); font-size: .875rem; }
.grand strong {
  display: block; font-size: 2.5rem; line-height: 1.05; font-weight: 700;
  letter-spacing: -.02em; font-variant-numeric: tabular-nums;
}
.sale-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

.empty-sale {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 56px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.empty-sale h2 { font-size: 1.5rem; }
.empty-sale p { color: var(--muted); margin-bottom: 10px; }
.empty-sale .roll {
  width: 72px; height: 88px; border-radius: 6px 6px 0 0; background: var(--paper);
  border: 2px solid var(--line); border-bottom: 0; position: relative; margin-bottom: 8px;
}
.empty-sale .roll::before, .empty-sale .roll::after {
  content: ''; position: absolute; left: 14px; right: 14px; height: 3px; border-radius: 2px; background: var(--line);
}
.empty-sale .roll::before { top: 22px; }
.empty-sale .roll::after { top: 34px; right: 26px; }

.today-list { display: flex; flex-direction: column; max-height: 62vh; overflow-y: auto; margin: 0 -8px; }
.today-row {
  display: grid; grid-template-columns: 48px 1fr auto; gap: 8px; align-items: center;
  padding: 9px 8px; border-radius: 8px; border: 0; background: transparent; text-align: left; cursor: pointer; width: 100%;
}
.today-row:hover { background: var(--paper); }
.today-row .t { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: .875rem; }
.today-row .id { font-size: .8rem; color: var(--muted); }
.today-row b { font-variant-numeric: tabular-nums; }
.today-sum { display: flex; justify-content: space-between; padding: 10px 0 0; margin-top: 8px; border-top: 1px solid var(--line-soft); font-size: .875rem; }

/* ---------- payment ---------- */
.due { text-align: center; padding: 6px 0 16px; }
.due span { color: var(--ink-2); font-size: .875rem; }
.due strong { display: block; font-size: 2.75rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); border-radius: 10px; padding: 4px; gap: 4px; margin-bottom: 16px; }
.seg button { border: 0; border-radius: 8px; padding: 10px; background: transparent; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--teal); box-shadow: 0 1px 3px rgba(11,76,83,.12); }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
.quick .btn { flex: 1; min-width: 80px; }
.change-box {
  display: flex; justify-content: space-between; align-items: baseline;
  background: var(--green-soft); color: var(--green); border-radius: 10px; padding: 12px 16px;
}
.change-box.short { background: var(--red-soft); color: var(--red); }
.change-box strong { font-size: 1.75rem; font-variant-numeric: tabular-nums; }
.cash-input { font-size: 1.5rem; min-height: 54px; }
.drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  border: 2px dashed var(--line); border-radius: 12px; padding: 22px; cursor: pointer; text-align: center; color: var(--ink-2);
}
.drop:hover { border-color: var(--teal-2); background: var(--teal-soft); }
.drop input { display: none; }
.slip-preview { display: block; max-width: 100%; max-height: 320px; margin: 12px auto 0; border-radius: 8px; border: 1px solid var(--line); }

/* ---------- receipt modal ---------- */
.rc-meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 16px; font-size: .875rem; margin-bottom: 14px; }
.rc-meta span { color: var(--muted); }
.rc-total { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-top: 1px dashed var(--line); margin-top: 8px; }
.rc-total strong { font-size: 1.75rem; font-variant-numeric: tabular-nums; }
details.more { margin-top: 12px; border-top: 1px solid var(--line-soft); padding-top: 10px; }
details.more summary { cursor: pointer; color: var(--teal); font-weight: 500; }

/* ---------- receive sheet ---------- */
.sheet { padding: 22px; }
.grid2 { display: grid; grid-template-columns: 220px 1fr; gap: 12px; margin: 10px 0 16px; }
.sheet-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
.sheet-total span { color: var(--ink-2); font-size: .875rem; }
.sheet-total strong { display: block; font-size: 1.75rem; font-variant-numeric: tabular-nums; }
.hint { font-size: .8125rem; color: var(--muted); margin-top: 12px; }

/* ---------- wallets ---------- */
.wallet-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) auto; gap: 16px; align-items: stretch; margin-bottom: 18px; }
.wallet {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px 20px; border-top: 4px solid var(--teal);
}
.wallet.transfer { border-top-color: var(--blue); }
.wallet .w-name { color: var(--ink-2); font-weight: 500; }
.wallet .w-bal { font-size: 2rem; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
.wallet .w-bal.neg { color: var(--red); }
.wallet .w-actions { margin-top: 12px; }
.wallet-side { display: flex; flex-direction: column; justify-content: center; gap: 8px; }

/* ---------- dashboard ---------- */
.kpis { display: grid; grid-template-columns: 1.6fr repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
.kpi span { color: var(--ink-2); font-size: .8125rem; }
.kpi strong { display: block; font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi small { color: var(--muted); font-size: .8rem; }
.kpi.hero { background: linear-gradient(135deg, var(--teal) 0%, var(--deep) 100%); color: #fff; grid-row: span 2; display: flex; flex-direction: column; justify-content: space-between; }
.kpi.hero span { color: #A9D3D6; }
.kpi.hero strong { font-size: 2.75rem; font-weight: 700; letter-spacing: -.02em; }
.split-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: rgba(255,255,255,.12); margin: 12px 0 8px; }
.split-bar i { display: block; height: 100%; }
.split-legend { display: flex; justify-content: space-between; font-size: .8125rem; color: #C7D4DA; gap: 10px; }
.split-legend b { color: #fff; font-variant-numeric: tabular-nums; font-weight: 500; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

.chart { display: flex; align-items: flex-end; gap: 4px; padding-top: 10px; overflow-x: auto; }
.bar-col { flex: 1 0 18px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bar-stack { height: 180px; width: 100%; max-width: 38px; display: flex; align-items: flex-end; }
.bar-rev { width: 100%; background: var(--teal-soft); border-radius: 4px 4px 0 0; position: relative; min-height: 1px; }
.bar-pro { position: absolute; left: 25%; right: 25%; bottom: 0; background: var(--teal); border-radius: 3px 3px 0 0; }
.bar-col label { font-size: .7rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; font-size: .8125rem; color: var(--ink-2); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; align-items: start; }
.alert-list { display: flex; flex-direction: column; }
.alert-item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: .875rem; }
.alert-item:last-child { border-bottom: 0; }
.alert-item small { display: block; color: var(--muted); }

/* ---------- modal / toast / busy ---------- */
.modal {
  position: fixed; inset: 0; z-index: 100; background: rgba(11,76,83,.45);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal-card {
  background: var(--surface); border-radius: 14px; width: min(520px, 100%); max-height: 92vh;
  display: flex; flex-direction: column; box-shadow: 0 20px 50px -12px rgba(0,0,0,.35);
  animation: rise .18s ease-out;
}
.modal-card.wide { width: min(1080px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line-soft); }
.modal-head h2 { font-size: 1.125rem; }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-body .field + .field { margin-top: 12px; }
.modal-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line-soft); }
.modal-foot:empty { display: none; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.form-grid .field + .field { margin-top: 0; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100% - 36px)); }
.toast {
  background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 10px;
  box-shadow: var(--shadow); font-size: .9rem; border-left: 4px solid #8FE3E4; animation: rise .18s ease-out;
}
.toast.err { border-left-color: #F08C85; }

.busy { position: fixed; inset: 0; z-index: 300; background: rgba(237,242,243,.55); display: grid; place-items: center; }
.spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--teal-soft); border-top-color: var(--teal); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- helpers used by Js ---------- */
.btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.inline { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
.stack > * + * { margin-top: 12px; }
.modal-body .stack .field + .field { margin-top: 12px; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 6px 0; }
.kv span { color: var(--ink-2); }
.kv b { font-variant-numeric: tabular-nums; }
.kv.big b { font-size: 1.5rem; color: var(--green); }
.today-sub { display: flex; justify-content: space-between; gap: 8px; font-size: .8125rem; color: var(--muted); padding-top: 2px; }
.toolbar .chk { min-height: 40px; }
.toolbar .field.grow { flex: 1; }
.link { border: 0; background: none; padding: 0; color: var(--teal); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; }
.meter.low > span { background: var(--amber); }
.meter.over > span { background: var(--blue); }
.tbl td.num .meter { margin: 5px 0 0 auto; max-width: 110px; }
.wallet-side .total { font-size: 1.375rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.wallet-side .total.neg { color: var(--red); }
.dash-bar .seg { margin: 0; min-width: 340px; }
.dash-period { font-size: 1.0625rem; font-weight: 600; margin-bottom: 12px; }
.kpi small { display: block; margin-top: 2px; }
.kpi.hero small { color: #A9D3D6; }
.alert-list + .card-head { margin-top: 20px; }
.alert-item > span { flex: none; }
.rlines + .btn, .lines + .btn { margin-top: 8px; align-self: flex-start; }
.modal-card.wide .rline { grid-template-columns: minmax(160px, 1.8fr) 80px 96px 80px 96px 104px 108px 36px; }

.login-error { background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 12px 14px;
  margin-bottom: 14px; font-size: .875rem; line-height: 1.5; }
.login-error p { margin-bottom: 8px; word-break: break-word; }
.chk.remember { margin: 2px 0 14px; color: var(--ink-2); font-size: .875rem; }

.side-me { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.side-me:hover strong { text-decoration: underline; }
.dev-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: .875rem; }
.dev-row small { display: block; color: var(--muted); }
.trail { font-size: .875rem; }
.trail-item { padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.trail-item .who { color: var(--ink-2); font-size: .8125rem; margin-bottom: 2px; }
.trail-item pre { margin-top: 6px; background: var(--paper); border-radius: 8px; padding: 10px;
  font-size: .75rem; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }

.login-ver { font-size: .75rem; color: var(--muted); text-align: right; margin: -6px 0 10px; }

/* ---------- product form sections ---------- */
.pf-sec { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; margin-bottom: 14px; background: var(--surface); }
.pf-sec h4 { font-size: .9375rem; font-weight: 600; margin: 0 0 12px; color: var(--ink); }
.pf-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.pf-sec-head h4 { margin: 0; }
.pf-sec .hint { margin: 0 0 10px; }
.pf-sec .field small { font-weight: 400; }
.uline { padding-left: 10px; padding-right: 10px; }
.uline.base-row { background: var(--paper); border-radius: 8px; border-bottom: 0; margin: 2px 0 4px; }
.uline.base-row .cell span { color: var(--ink-2); }

/* ---------- gallery ---------- */
.gallery { position: fixed; inset: 0; z-index: 250; display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(15, 22, 28, .72); }
.g-card { width: min(920px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface); border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
.g-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line-soft); }
.g-head .grow { flex: 1; }
.g-main { position: relative; height: 60vh; min-height: 260px; background: #0F161C; }
.g-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: auto; }
.g-stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
.g-stage .muted { color: #A9D3D6; }
.g-stage.actual { align-items: flex-start; justify-content: flex-start; }
.g-stage.actual img { max-width: none; max-height: none; cursor: zoom-out; }
.g-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 42px; height: 58px;
  border: 0; border-radius: 10px; background: rgba(255, 255, 255, .16); color: #fff; font-size: 1.75rem; cursor: pointer; }
.g-nav:hover:not(:disabled) { background: rgba(255, 255, 255, .28); }
.g-nav:disabled { opacity: .2; cursor: default; }
.g-nav.prev { left: 10px; }
.g-nav.next { right: 10px; }
.g-strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; }
.g-thumb { flex: 0 0 76px; height: 76px; padding: 0; border-radius: 8px; border: 2px solid transparent; overflow: hidden;
  background: var(--paper); cursor: pointer; display: grid; place-items: center; scroll-snap-align: center; }
.g-thumb.on { border-color: var(--teal); }
.g-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery.full { padding: 0; }
.gallery.full .g-card { width: 100%; height: 100%; max-height: none; border-radius: 0; }
.gallery.full .g-main { flex: 1; height: auto; }
.thumb .file img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ev-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid var(--line-soft); font-size: .9375rem; }

/* ---------- document lists & forms ---------- */
.doc-new {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 2px dashed var(--teal-2); border-radius: var(--radius);
  padding: 16px 20px; margin-bottom: 16px; color: var(--teal); box-shadow: var(--shadow);
}
.doc-new:hover { background: var(--teal-soft); }
.doc-new .plus {
  width: 38px; height: 38px; border-radius: 10px; background: var(--teal); color: #fff;
  display: grid; place-items: center; font-size: 1.5rem; line-height: 1; flex: none;
}
.doc-new b { display: block; font-size: 1.0625rem; }
.doc-new span { color: var(--ink-2); font-size: .875rem; }
.bill-head { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 12px 0 16px; }
.bill-head .full { grid-column: 1 / -1; }
.fixed-field { display: flex; align-items: center; min-height: 40px; padding: 9px 11px; border-radius: 8px;
  background: var(--paper); border: 1px dashed var(--line); color: var(--ink-2); }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.thumb { position: relative; display: block; width: 86px; height: 86px; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--line); background: var(--paper); cursor: pointer; padding: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .x { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 6px;
  border: 0; background: rgba(11,76,83,.72); color: #fff; cursor: pointer; font-size: .8rem; line-height: 1; }
.thumb .file { display: grid; place-items: center; width: 100%; height: 100%; border: 0; background: transparent;
  font: inherit; font-size: .75rem; color: var(--ink-2); padding: 4px; cursor: pointer; text-align: center; }
.add-img { width: 86px; height: 86px; border-radius: 8px; border: 2px dashed var(--line); background: transparent;
  color: var(--ink-2); cursor: pointer; display: grid; place-items: center; font-size: .8rem; }
.add-img:hover { border-color: var(--teal-2); color: var(--teal); }
.add-img input { display: none; }
.disc-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; margin-top: 14px;
  padding-top: 14px; border-top: 1px dashed var(--line); }
.disc-row .field { width: 180px; }
.sums { margin-left: auto; text-align: right; font-size: .9rem; color: var(--ink-2); }
.sums b { font-variant-numeric: tabular-nums; color: var(--ink); }
.sums .net { font-size: 1.75rem; font-weight: 700; display: block; letter-spacing: -.02em; }
.block { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
.block > h3 { margin-bottom: 8px; }
.warn-box { background: var(--amber-soft); color: var(--amber); border-radius: 10px; padding: 14px 16px; }
.warn-box b { display: block; margin-bottom: 4px; }

.pick-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; margin-top: 8px; }
.pick { text-align: left; padding: 20px; border: 2px solid var(--line); border-radius: 12px;
  background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
.pick:hover { border-color: var(--teal); background: var(--teal-soft); }
.pick b { display: block; font-size: 1.0625rem; margin-bottom: 6px; }
.pick span { color: var(--ink-2); font-size: .875rem; line-height: 1.5; }
.stamp-edit { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.stamp-edit input { padding: 7px 9px; font-size: .875rem; width: auto; }
.stamp .btn { margin-top: 8px; }
.doc-type-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

/* ---------- responsive ---------- */
@media (max-width: 1500px) {
  .sale-layout { grid-template-columns: 1fr; }
}
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .kpi.hero { grid-column: 1 / -1; grid-row: auto; }
  .dash-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .line.line-head, .rline.line-head { display: none; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: transform .2s; }
  .app.nav-open .sidebar { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(11,76,83,.4); z-index: 20; }
  .hamburger { display: block; }
  .topbar { padding: 12px 16px; }
  .top-clock [data-date] { display: none; }
  .view { padding: 16px 14px 40px; }
  .wallet-row { grid-template-columns: 1fr 1fr; }
  .wallet-side { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  /* กันเบราว์เซอร์มือถือซูมเข้าเวลาแตะช่องกรอก */
  input, select, textarea { font-size: 16px; }
  .btn, .seg button, .pick, .today-row, .tbl tbody tr.click td { min-height: 44px; }
  .btn.sm { min-height: 36px; }
  .btn.lg { width: 100%; }
  .view { padding: 12px 10px 40px; }
  .card, .receipt, .sheet { padding: 14px 12px; border-radius: 12px; }
  .toolbar { gap: 8px; margin-bottom: 12px; }
  .toolbar .field { flex: 1 1 140px; min-width: 0; }
  .range-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
  .range-bar .btn { width: 100%; }
  .range-bar .btn.primary { grid-column: 1 / -1; }
  .range-bar .field { min-width: 0; }
  .range-bar .field > span { font-size: .75rem; }
  .doc-new { padding: 12px 14px; margin-bottom: 12px; }
  .doc-new span span { display: none; }
  .tbl { font-size: .875rem; }
  .tbl th, .tbl td { padding: 9px 7px; }
  .tbl .hide-m { display: none; }
  .only-m { display: inline; }
  .tbl td.cm { min-width: 140px; }
  .tbl td.dt { font-size: .8125rem; }
  .tbl .badge { font-size: .7rem; padding: 2px 7px; }
  .tbl td.actions-cell .btn { display: block; width: 100%; margin: 3px 0; }
  .tbl .actions-cell { white-space: nowrap; }
  .sale-layout { grid-template-columns: 1fr; }
  .sale-actions { position: sticky; bottom: 0; background: var(--paper); padding: 10px 0 4px; z-index: 5; }
  .sheet-foot { flex-direction: column; align-items: stretch; gap: 12px; }

    // ตัวเฝ้าระวังการโหลดสคริปต์ — อยู่แยกไฟล์กับ Js.html เพื่อให้ทำงานได้แม้ Js.html จะพัง
    window.__molaErrors = [];
    window.__molaShowBootError = function (msg) {
      var box = document.getElementById('loginError');
      var p = document.getElementById('loginErrorMsg');
      var retry = document.getElementById('loginRetry');
      if (!box || !p) { alert(msg); return; }
      box.hidden = false;
      p.textContent = msg;
      if (retry) retry.onclick = function () { location.reload(); };
    };
    window.addEventListener('error', function (e) {
      var m = (e && e.message) || 'error';
      if (e && e.filename) m += ' (' + e.filename + ':' + (e.lineno || '?') + ')';
      window.__molaErrors.push(m);
    });
    window.addEventListener('load', function () {
      setTimeout(function () {
        var bad = [];
        if (!window.__MOLA_PART1) bad.push('Js1');
        if (!window.__MOLA_PART2) bad.push('Js2');
        if (!window.__MOLA_PART3) bad.push('Js3');
        if (!bad.length && window.__MOLA_JS_OK) return;
        window.__molaShowBootError(
          'สคริปต์หน้าเว็บทำงานไม่สำเร็จ · ไฟล์ที่ต้องวางใหม่: ' + (bad.length ? bad.join(', ') : 'ไม่ทราบ') +
          (window.__molaErrors.length ? ' · ข้อความ: ' + window.__molaErrors.join(' | ') : '') +
          ' · วิธีแก้: เปิดไฟล์นั้นใน Apps Script กด Ctrl+A ลบทิ้ง แล้ววางใหม่ทั้งไฟล์ ' +
          '(บรรทัดสุดท้ายของทุกไฟล์ต้องเป็นแท็กปิด script) จากนั้น Deploy → Manage deployments → ✏️ → Version: New version');
      }, 4000);
    });
  </script>

/* ---------------- API ---------------- */
let busyN = 0, busyT = null;
function busy(on) {
  busyN = Math.max(0, busyN + (on ? 1 : -1));
  clearTimeout(busyT);
  if (busyN) busyT = setTimeout(() => { $('#busy').hidden = false; }, 180);
  else $('#busy').hidden = true;
}
function cleanErr(e) {
  let m = String((e && e.message) || e || 'เกิดข้อผิดพลาด');
  const pre = ['Exception:', 'Error:', 'ScriptError:', 'TypeError:'];
  for (let i = 0; i < pre.length; i++) {
    if (m.indexOf(pre[i]) === 0) { m = m.slice(pre[i].length); break; }
  }
  return m.trim();
}
// ช่องทางติดต่อเซิร์ฟเวอร์: ถ้าเปิดผ่าน Apps Script ใช้ google.script.run
// ถ้าหน้าเว็บโฮสต์แยก (มี window.MOLA_API_URL ใน config.js) ใช้ fetch ไปยังลิงก์ /exec
const API_URL = String(window.MOLA_API_URL || '').trim();
function hasGasRun() { return !!(window.google && google.script && google.script.run); }

function callFetch(fn, args, showBusy) {
  return new Promise((resolve, reject) => {
    if (showBusy) busy(true);
    const done = () => { if (showBusy) busy(false); };
    const failWith = msg => {
      done();
      if (msg.indexOf('SESSION_EXPIRED') >= 0) { sessionExpired(); reject(new Error('SESSION_EXPIRED')); return; }
      reject(new Error(msg));
    };
    // ส่งเป็น text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง preflight (Apps Script ไม่รองรับ)
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
      .then(r => r.json())
      .then(j => { if (j && j.ok) { done(); resolve(j.result); } else failWith(cleanErr((j && j.error) || 'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง')); })
      .catch(e => failWith('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจอินเทอร์เน็ตหรือลิงก์ API (' + cleanErr(e) + ')'));
  });
}

function call(fn, args, showBusy) {
  if (!hasGasRun()) {
    if (API_URL) return callFetch(fn, args, showBusy);
    return Promise.reject(new Error('ต้องเปิดผ่าน Google Apps Script Web App หรือตั้งค่าลิงก์ API ใน config.js'));
  }
  return new Promise((resolve, reject) => {
    if (showBusy) busy(true);
    google.script.run
      .withSuccessHandler(r => { if (showBusy) busy(false); resolve(r); })
      .withFailureHandler(e => {
        if (showBusy) busy(false);
        const msg = cleanErr(e);
        if (msg.indexOf('SESSION_EXPIRED') >= 0) {
          sessionExpired();
          reject(new Error('SESSION_EXPIRED'));
          return;
        }
        reject(new Error(msg));
      })[fn](...args);
  });
}
function api(fn, ...args) { return call(fn, args, true); }
function apiQuiet(fn, ...args) { return call(fn, args, false); }
function fail(e) {
  if (e && e.message === 'SESSION_EXPIRED') return;
  toast(cleanErr(e), true);
}

/* ---------------- รูปภาพ ---------------- */
// บีบอัดรูปก่อนอัปโหลด: คุณภาพกลาง อ่านตัวหนังสือในใบเสร็จ/สลิปได้ชัด
// จำกัดที่ ~2.5 ล้านพิกเซล (ใบเสร็จยาว ๆ ยังคงความกว้างพอให้อ่านได้) และคุณภาพ JPEG 72%
const IMG_MAX_PIXELS = 2500000;
const IMG_MAX_SIDE = 3200;
const IMG_QUALITY = 0.72;

function fmtBytes(n) {
  n = Number(n) || 0;
  return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (String(file.type).indexOf('image/') !== 0) { reject(new Error('กรุณาเลือกไฟล์รูปภาพ')); return; }
    if (file.size > 25 * 1024 * 1024) { reject(new Error('ไฟล์รูปใหญ่เกินไป (เกิน 25 MB)')); return; }
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('ไม่รองรับรูปนี้ (ลองใช้ไฟล์ JPG/PNG)'));
      img.onload = () => {
        const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
        const sc = Math.min(1, IMG_MAX_SIDE / Math.max(w0, h0), Math.sqrt(IMG_MAX_PIXELS / Math.max(1, w0 * h0)));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w0 * sc));
        c.height = Math.max(1, Math.round(h0 * sc));
        const g = c.getContext('2d');
        g.imageSmoothingEnabled = true;
        g.imageSmoothingQuality = 'high';
        g.fillStyle = '#fff';
        g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        let data = c.toDataURL('image/jpeg', IMG_QUALITY);
        let mime = 'image/jpeg';
        // ถ้าไฟล์เดิมเล็กกว่าอยู่แล้วและไม่ต้องย่อ (เช่น ภาพหน้าจอสลิป) ใช้ไฟล์เดิม
        const keepOriginal = sc === 1 && (file.type === 'image/jpeg' || file.type === 'image/png') &&
          file.size && file.size < data.length * 0.75;
        if (keepOriginal) { data = fr.result; mime = file.type; }
        const bytes = Math.round(data.length * 0.75);
        if (bytes > 5 * 1024 * 1024) { reject(new Error('รูปใหญ่เกิน 5 MB หลังบีบอัด')); return; }
        resolve({ data: data, mimeType: mime, bytes: bytes, origBytes: file.size || bytes });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// กล่องแนบรูป: st = { keep: [{id,name}], add: [{data,mimeType}] }
function ImageBox(box, st, label) {
  function count() { return st.keep.length + st.add.length; }
  function items() { return st.keep.map(f => ({ id: f.id })).concat(st.add.map(f => ({ data: f.data }))); }
  function draw() {
    box.innerHTML =
      st.keep.map((f, i) => `<span class="thumb">
          <button type="button" class="file" data-gi="${i}" data-kid="${esc(f.id)}">รูป #${i + 1}</button>
          <button type="button" class="x" data-dk="${i}" aria-label="ลบ">✕</button></span>`).join('') +
      st.add.map((f, i) => `<span class="thumb">
          <button type="button" class="file" data-gi="${st.keep.length + i}"><img src="${f.data}" alt="รูปแนบ"></button>
          <button type="button" class="x" data-da="${i}" aria-label="ลบ">✕</button></span>`).join('') +
      (count() < MAX_IMG
        ? `<label class="add-img">+ เพิ่มรูป<input type="file" accept="image/*" multiple></label>`
        : `<span class="muted">ครบ ${MAX_IMG} รูปแล้ว</span>`);
    const inp = $('input[type="file"]', box);
    if (inp) inp.onchange = async () => {
      const files = Array.from(inp.files || []);
      inp.value = '';
      let before = 0, after = 0;
      for (const f of files) {
        if (count() >= MAX_IMG) { toast(`${label} แนบได้ไม่เกิน ${MAX_IMG} รูป`, true); break; }
        try {
          const im = await compressImage(f);
          before += im.origBytes;
          after += im.bytes;
          st.add.push({ data: im.data, mimeType: im.mimeType });
        } catch (e) { toast(cleanErr(e), true); }
      }
      if (after) toast(`บีบอัดรูปแล้ว ${fmtBytes(before)} → ${fmtBytes(after)}`);
      draw();
    };
    $$('[data-dk]', box).forEach(b => { b.onclick = () => { st.keep.splice(+b.dataset.dk, 1); draw(); }; });
    $$('[data-da]', box).forEach(b => { b.onclick = () => { st.add.splice(+b.dataset.da, 1); draw(); }; });
    $$('[data-gi]', box).forEach(b => { b.onclick = () => openGallery(label, items(), +b.dataset.gi); });
    // โหลดภาพย่อของรูปที่บันทึกไว้แล้ว
    $$('[data-kid]', box).forEach(b => {
      imgSrc({ id: b.dataset.kid }).then(src => {
        if (b.isConnected) b.innerHTML = `<img src="${src}" alt="รูปที่บันทึกไว้">`;
      }).catch(() => {});
    });
  }
  draw();
  return { draw: draw, state: st };
}

const IMG_CACHE = {};

}

let GAL = null;

function openGallery(title, items, start) {
  if (!items || !items.length) { toast('ยังไม่มีรูปในหมวดนี้', true); return; }
  closeGallery();
  const el = document.createElement('div');
  el.className = 'gallery';
  el.innerHTML = `<div class="g-card" role="dialog" aria-label="${esc(title)}">
      <div class="g-head">
        <b>${esc(title)}</b><span class="muted" data-g="count"></span><span class="grow"></span>
        <button type="button" class="btn sm" data-g="zoom">ขยาย</button>
        <button type="button" class="icon-btn" data-g="close" aria-label="ปิด">✕</button>
      </div>
      <div class="g-main">
        <button type="button" class="g-nav prev" data-g="prev" aria-label="ก่อนหน้า">‹</button>
        <div class="g-stage" data-g="stage"><span class="muted">กำลังโหลด…</span></div>
        <button type="button" class="g-nav next" data-g="next" aria-label="ถัดไป">›</button>
      </div>
      <div class="g-strip" data-g="strip">${items.map((it, i) =>
        `<button type="button" class="g-thumb" data-i="${i}"><span class="muted">${i + 1}</span></button>`).join('')}</div>
    </div>`;
  document.body.appendChild(el);
  const q = k => el.querySelector(`[data-g="${k}"]`);
  const thumbs = $$('.g-thumb', el);
  let idx = Math.max(0, Math.min(start || 0, items.length - 1));
  let req = 0;

  function show(i) {
    idx = (i + items.length) % items.length;
    q('count').textContent = ` · ${idx + 1} / ${items.length}`;
    q('prev').disabled = items.length < 2;
    q('next').disabled = items.length < 2;
    thumbs.forEach((t, k) => t.classList.toggle('on', k === idx));
    const th = thumbs[idx];
    if (th && th.scrollIntoView) th.scrollIntoView({ block: 'nearest', inline: 'center' });
    const stage = q('stage');
    stage.classList.remove('actual');
    stage.innerHTML = '<span class="muted">กำลังโหลด…</span>';
    const my = ++req;
    imgSrc(items[idx]).then(src => {
      if (my !== req || !el.isConnected) return;
      stage.innerHTML = `<img src="${src}" alt="รูปที่ ${idx + 1}">`;
      stage.querySelector('img').onclick = () => {
        if (!el.classList.contains('full')) { el.classList.add('full'); q('zoom').textContent = 'ย่อ'; return; }
        stage.classList.toggle('actual');
      };
    }).catch(e => {
      if (my === req) stage.innerHTML = `<span class="muted">โหลดรูปไม่สำเร็จ: ${esc(cleanErr(e))}</span>`;
    });
  }

  q('close').onclick = closeGallery;
  q('prev').onclick = () => show(idx - 1);
  q('next').onclick = () => show(idx + 1);
  q('zoom').onclick = () => {
    const full = el.classList.toggle('full');
    q('zoom').textContent = full ? 'ย่อ' : 'ขยาย';
    if (!full) q('stage').classList.remove('actual');
  };
  thumbs.forEach(t => { t.onclick = () => show(+t.dataset.i); });
  el.addEventListener('click', e => { if (e.target === el) closeGallery(); });

  // ปัดซ้าย-ขวาบนรูปเพื่อเปลี่ยนรูป
  let x0 = null;
  q('stage').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  q('stage').addEventListener('touchend', e => {
    if (x0 === null || q('stage').classList.contains('actual')) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1));
  });

  // ภาพย่อในแถบเลื่อน (โหลดทีละรูป)
  items.reduce((p, it, i) => p.then(() => imgSrc(it).then(src => {
    if (thumbs[i] && thumbs[i].isConnected) thumbs[i].innerHTML = `<img src="${src}" alt="">`;
  }).catch(() => {})), Promise.resolve());

  GAL = { el: el, show: show, step: d => show(idx + d) };
  show(idx);
}

  openGallery(title || 'รูปหลักฐาน', [{ id: fileId }], 0);
}

/* ---------------- LOGIN ---------------- */
function boot() {
  tick();
  const el = $('#rememberMe');
  if (el) el.checked = false;
  const tk = readToken();
  // ไม่มี token ในเครื่อง (เช่น iPhone ล้างหลังปิดแอป) → ขอให้เซิร์ฟเวอร์ดูว่าบัญชี Google นี้
  // เคยติ๊ก "จำการเข้าสู่ระบบ" บนอุปกรณ์ชนิดนี้ไว้ไหม ระหว่างนั้นแสดงหน้า login ไว้ก่อน
  const tryResume = () => {
    showLogin();
    if (!hasGasRun()) return;        // โหมดโฮสต์แยก: localStorage ถาวรอยู่แล้ว ไม่ต้องกู้คืน
    apiQuiet('resumeSession', deviceName())
      .then(s => { saveToken(s.token, true); enterApp(s); })
      .catch(() => { /* ไม่มีที่จำไว้ → อยู่หน้า login ตามปกติ */ });
  };
  if (!tk) { tryResume(); return; }
  apiQuiet('getSession', tk)
    .then(enterApp)
    .catch(() => { clearToken(); tryResume(); });
}

// แสดงข้อผิดพลาดบนหน้าเข้าสู่ระบบ (รวมถึง error ของสคริปต์เอง)
function loginError(msg, retry) {
  const box = $('#loginError');
  if (!box) return;
  box.hidden = false;
  $('#loginErrorMsg').textContent = msg;
  $('#loginRetry').hidden = !retry;
}
function clearLoginError() {
  const box = $('#loginError');
  if (box) box.hidden = true;
}
window.addEventListener('error', e => {
  if ($('#login') && !$('#login').hidden) {
    loginError('เกิดข้อผิดพลาดในหน้าเว็บ: ' + (e.message || 'ไม่ทราบสาเหตุ') +
      ' — ตรวจว่าได้คัดลอกไฟล์ Index / Css / Js ครบและ Deploy เวอร์ชันใหม่แล้ว', true);
  }
});

function showLogin() {
  closeModal();
  $('#app').hidden = true;
  $('#login').hidden = false;
  toggleSidebar(false);
  loadLoginUsers();
}

let loginTimer = null;
function loadLoginUsers() {
  const sel = $('#loginUser');
  sel.disabled = true;
  sel.innerHTML = '<option value="">กำลังโหลดรายชื่อ…</option>';
  S.loginUser = null;
  $('#pinStage').hidden = true;
  clearLoginError();
  resetPinPad();
  if ($('#rememberMe')) $('#rememberMe').checked = false;
  const retry = $('#loginRetry');
  if (retry) retry.onclick = loadLoginUsers;

  clearTimeout(loginTimer);
  let done = false;
  loginTimer = setTimeout(() => {
    if (done) return;
    sel.innerHTML = '<option value="">โหลดรายชื่อไม่สำเร็จ</option>';
    loginError('เซิร์ฟเวอร์ไม่ตอบกลับภายใน 20 วินาที — ลองใหม่อีกครั้ง ' +
      'ถ้ายังไม่ได้ ให้เปิดหน้า Apps Script แล้วรันฟังก์ชัน diagnose() เพื่อตรวจระบบ', true);
  }, 20000);

  apiQuiet('getLoginUsers').then(list => {
    done = true;
    clearTimeout(loginTimer);
    S.users = list || [];
    if (!S.users.length) {
      sel.innerHTML = '<option value="">ยังไม่มีรายชื่อในชีต Users</option>';
      loginError('ยังไม่มีรายชื่อผู้ใช้ — เพิ่มชื่อและสิทธิ์ในชีต Users แล้วกดลองใหม่', true);
      return;
    }
    sel.innerHTML = '<option value="">— เลือกชื่อของคุณ —</option>' + S.users.map(u =>
      `<option value="${esc(u.id)}">${esc(u.name)}${u.hasPin ? '' : ' (ยังไม่ตั้ง PIN)'}</option>`).join('');
    sel.disabled = false;
    const last = store.get('nrd_last_user');
    if (last && S.users.some(u => u.id === last)) { sel.value = last; onLoginUser(last); }
  }).catch(e => {
    done = true;
    clearTimeout(loginTimer);
    sel.innerHTML = '<option value="">โหลดรายชื่อไม่สำเร็จ</option>';
    loginError(cleanErr(e), true);
  });
}

function onLoginUser(id) {
  S.loginUser = S.users.find(u => u.id === id) || null;
  resetPinPad();
  $('#pinStage').hidden = !S.loginUser;
  if (!S.loginUser) return;

  if (S.loginUser.hasPin) {
    setPinTitle('ใส่ PIN 6 หลัก');
    setPinMsg('');
  } else {
    setPinTitle('ตั้ง PIN ใหม่ 6 หลัก');
    setPinMsg('เข้าใช้งานครั้งแรก — กรุณาตั้ง PIN ของคุณ', true);
  }
}

function setPinTitle(t) { $('#pinTitle').textContent = t; }
function setPinMsg(t, info) {
  const m = $('#pinMsg');
  m.textContent = t || '';
  m.classList.toggle('info', !!info);
}
function resetPinPad() { S.pin = ''; S.pinFirst = null; S.pinBusy = false; drawDots(); }
function drawDots(state) {
  const box = $('#pinDots');
  box.className = 'pin-dots' + (state ? ' ' + state : '');
  $$('i', box).forEach((d, i) => d.classList.toggle('on', i < S.pin.length));
}
function shakeDots(msg) {
  S.pin = '';
  drawDots();
  setPinMsg(msg);
  const box = $('#pinDots');
  void box.offsetWidth;
  box.classList.add('shake');
}
function weakPin(p) {
  let same = true;
  for (let i = 1; i < p.length; i++) { if (p.charAt(i) !== p.charAt(0)) { same = false; break; } }
  return same || '0123456789'.indexOf(p) >= 0 || '9876543210'.indexOf(p) >= 0;
}

function pinKey(k) {
  if (!S.loginUser || S.pinBusy) return;
  if (k === 'clear') S.pin = '';
  else if (k === 'back') S.pin = S.pin.slice(0, -1);
  else if (isDigit(k) && S.pin.length < 6) S.pin += k;
  drawDots();
  if (S.pin.length === 6) submitPin();
}

function submitPin() {
  const u = S.loginUser, pin = S.pin;
  if (!u.hasPin) {
    if (S.pinFirst === null) {
      if (weakPin(pin)) { shakeDots('PIN เดาง่ายเกินไป (เลขซ้ำ/เรียงกัน) กรุณาตั้งใหม่'); return; }
      S.pinFirst = pin;
      S.pin = '';
      setTimeout(() => {
        drawDots();
        setPinTitle('ยืนยัน PIN อีกครั้ง');
        setPinMsg('ใส่ PIN เดิมอีกครั้งเพื่อยืนยัน', true);
      }, 160);
      return;
    }
    if (pin !== S.pinFirst) {
      S.pinFirst = null;
      setPinTitle('ตั้ง PIN ใหม่ 6 หลัก');
      shakeDots('PIN ทั้งสองครั้งไม่ตรงกัน กรุณาตั้งใหม่');
      return;
    }
  }
  S.pinBusy = true;
  drawDots('working');
  setPinMsg(u.hasPin ? 'กำลังตรวจสอบ…' : 'กำลังบันทึก PIN…', true);
  const remember = rememberWanted();
  apiQuiet(u.hasPin ? 'login' : 'setupPin', u.id, pin, remember, deviceName())
    .then(s => {
      S.pinBusy = false;
      saveToken(s.token, remember);
      // จำชื่อไว้เฉพาะเมื่อเลือก "จำการเข้าสู่ระบบ"
      if (remember) store.set('nrd_last_user', u.id); else store.del('nrd_last_user');
      enterApp(s);
      if (remember && s.canResume === false && hasGasRun()) {
        toast('เบราว์เซอร์นี้ไม่ได้ลงชื่อเข้าบัญชี Google — จะจำการเข้าสู่ระบบได้จนกว่าจะปิดแอป ' +
          'ถ้าต้องการให้จำหลังปิดแอป ให้ลงชื่อเข้า Google ในเบราว์เซอร์ก่อน', true);
      }
    })
    .catch(e => {
      S.pinBusy = false;
      const msg = cleanErr(e);
      if (!u.hasPin) { S.pinFirst = null; setPinTitle('ตั้ง PIN ใหม่ 6 หลัก'); }
      shakeDots(msg);
      if (/ตั้ง PIN แล้ว|ยังไม่ได้ตั้ง PIN|ไม่พบผู้ใช้/.test(msg)) setTimeout(loadLoginUsers, 1500);
    });
}

document.addEventListener('keydown', e => {
  if (GAL) {
    if (e.key === 'Escape') { closeGallery(); return; }
    if (e.key === 'ArrowLeft') { GAL.step(-1); return; }
    if (e.key === 'ArrowRight') { GAL.step(1); return; }
  }
  if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); return; }
  if ($('#login').hidden || $('#pinStage').hidden) return;
  if (isDigit(e.key)) { e.preventDefault(); pinKey(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); pinKey('back'); }
  else if (e.key === 'Delete') pinKey('clear');
});
document.addEventListener('wheel', () => {
  const a = document.activeElement;
  if (a && a.type === 'number') a.blur();
}, { passive: true });

/* ---------------- SESSION / SHELL ---------------- */
function enterApp(s) {
  S.token = s.token;
  S.user = s.user;
  S.perms = s.perms || {};
  if (S.draftOwner && S.draftOwner !== s.user.id) { S.sale = null; S.recv = null; S.adj = null; }
  S.draftOwner = s.user.id;
  $('#userName').textContent = s.user.name;
  $('#userRole').textContent = ROLE_TH[s.user.role] || s.user.role;
  $$('[data-perm]').forEach(el => { el.hidden = !S.perms[el.dataset.perm]; });
  resetPinPad();
  $('#login').hidden = true;
  $('#app').hidden = false;
  const want = store.get('nrd_view', true);
  go(want && canView(want) ? want : firstView());
}

function clearSession() {
  S.token = null; S.user = null; S.perms = {}; S.view = null; S.seq++;
  S.ctxAt = { sale: 0, receive: 0, adjust: 0 };   // ข้อมูลสินค้าที่แคชไว้อาจมีต้นทุน ไม่ส่งต่อให้ผู้ใช้คนถัดไป
  clearToken();
  store.del('nrd_view', true);
}

function sessionExpired() {
  if (!S.token) return;
  clearSession();
  showLogin();
  toast('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่ (รายการที่ยังไม่บันทึกยังอยู่)', true);
}

async function doLogout(skipConfirm) {
  if (!skipConfirm && hasDraft()) {
    const ok = await confirmBox('ออกจากระบบ',
      'มีเอกสารที่ยังไม่ได้บันทึก ต้องการออกจากระบบหรือไม่?', 'ออกจากระบบ', true);
    if (!ok) return;
  }
  const tk = S.token;
  S.sale = null;
  S.recv = null;
  S.adj = null;
  clearSession();
  store.del('nrd_last_user');      // ออกจากระบบเอง = ไม่ต้องจำชื่อไว้
  if (tk) apiQuiet('logout', tk).catch(() => {});
  showLogin();
}

function hasDraft() {
  return !!(S.sale && S.sale.lines.some(l => l.productId)) ||
         !!(S.recv && S.recv.lines.some(l => l.productId)) ||
         !!(S.adj && (S.adj.kind === 'MONEY' ? S.adj.amount : S.adj.lines.some(l => l.productId)));
}
window.addEventListener('beforeunload', e => {
  if (hasDraft()) { e.preventDefault(); e.returnValue = ''; }
});

function docAge(dateStr) { return dateStr ? daysDiff(String(dateStr).slice(0, 10), todayYmd()) : 0; }
function saleEditable(d) {
  if (!d || d.status === 'VOID') return false;
  if (S.user.role === 'Admin') return true;
  const age = docAge(d.date);
  if (S.user.role === 'User') return d.userId === S.user.id && age <= (S.perms.saleEditDays || 0);
  return age <= (S.perms.editWindowDays || 0);
}
function receiveEditable(d) {
  if (!d || d.status === 'VOID') return false;
  if (S.user.role === 'Admin') return true;
  return docAge(d.date) <= (S.perms.editWindowDays || 0);
}

function canView(v) { return !!(VIEWS[v] && S.perms[VIEWS[v].perm]); }
function firstView() { return ['sale', 'receive', 'dashboard', 'products'].find(canView) || 'sale'; }
function alive(seq) { return seq === S.seq; }
function toggleSidebar(on) { $('#app').classList.toggle('nav-open', !!on); }

function go(v) {
  if (!canView(v)) { toast('คุณไม่มีสิทธิ์ใช้งานส่วนนี้', true); return; }
  closeModal();
  S.view = v;
  S.seq++;
  store.set('nrd_view', v, true);
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  $('#pageTitle').textContent = VIEWS[v].title;
  // เอกลักษณ์ของหน้า: ไอคอน + สีประจำหน้า + แอนิเมชันตอนเปลี่ยนหน้า (ให้รู้ชัดบนมือถือว่าเปลี่ยนเมนูแล้ว)
  const navBtn = $(`.nav-item[data-view="${v}"]`);
  const svg = navBtn && (navBtn.querySelector('svg') || (navBtn.closest('.nav-group') && navBtn.closest('.nav-group').querySelector('.nav-label svg')));
  const icon = $('#pageIcon');
  if (icon) icon.innerHTML = svg ? svg.outerHTML : '';
  document.body.dataset.page = VIEWS[v].perm;
  const pid = $('#pageId');
  if (pid) { pid.classList.remove('bump'); void pid.offsetWidth; pid.classList.add('bump'); }
  toggleSidebar(false);
  const el = $('#view');
  el.innerHTML = '';
  el.classList.remove('enter');
  void el.offsetWidth;
  el.classList.add('enter');
  window.scrollTo(0, 0);
  viewRenderer(v)(el, S.seq);
  tick();
}

// สวิทช์แก้วันที่/เวลาของเอกสาร — state.date = null (อัตโนมัติ) หรือ { ymd, hm }
function stampHtml(state) {
  const d = state.date;
  const body = d
    ? `<div class="stamp-edit">
         <input type="date" data-dt="ymd" value="${esc(d.ymd)}" aria-label="วันที่เอกสาร">
         <input type="time" data-dt="hm" value="${esc(d.hm)}" aria-label="เวลาเอกสาร"></div>`
    : (state.savedDate
      ? `<div>${dtThai(state.savedDate)}</div><div class="muted">เวลาที่บันทึกไว้</div>`
      : '<div data-date></div><div class="clock" data-clock></div>');
  return `${body}<button type="button" class="btn sm ${d ? 'danger' : 'ghost'}" data-dt-toggle>${
    d ? (state.savedDate ? 'ใช้เวลาเดิม' : 'ใช้เวลาปัจจุบัน') : 'แก้วันที่/เวลา'}</button>`;
}

function renderStamp(state) {
  const box = $('#stampBox');
  if (!box) return;
  box.innerHTML = stampHtml(state);
  const t = $('[data-dt-toggle]', box);
  t.onclick = () => {
    if (state.date) state.date = null;
    else if (state.savedDate) {
      state.date = { ymd: state.savedDate.slice(0, 10), hm: state.savedDate.slice(11, 16) };
    } else {
      const p = nowParts();
      state.date = { ymd: `${p.year}-${p.month}-${p.day}`, hm: `${p.hour}:${p.minute}` };
    }
    renderStamp(state);
  };
  $$('[data-dt]', box).forEach(i => { i.oninput = () => { state.date[i.dataset.dt] = i.value; }; });
  tick();
}

function docDateValue(state) {
  if (!state.date) return '';
  if (!state.date.ymd || !state.date.hm) throw new Error('กรุณาระบุวันที่และเวลาของเอกสารให้ครบ');
  return `${state.date.ymd} ${state.date.hm}:00`;
}

// แคชข้อมูลตั้งต้น (สินค้า/เจ้าหน้าที่) เพื่อลดการรอโหลดซ้ำ
const CTX_TTL = 120000;
const CTX_FN = { sale: 'getSaleContext', receive: 'getReceiveContext', adjust: 'getAdjustContext' };
S.ctxAt = { sale: 0, receive: 0, adjust: 0 };

function applyCtx(kind, ctx) {
  if (!ctx) return;
  if (kind === 'sale') {
    // หน้าขายใช้เฉพาะหน่วยที่ขายได้ (หน่วยรับเข้าอย่างเดียวจะไม่แสดง)
    S.saleProducts = (ctx.products || []).map(p => Object.assign({}, p, {
      units: (p.units || []).filter(u => u.base || u.sell !== false)
    }));
  }
  if (kind === 'receive') S.recvProducts = ctx.products || [];
  if (kind === 'adjust') { S.adjProducts = ctx.products || []; S.adjWallets = ctx.wallets || []; }
  if (ctx.staff) needStaff(ctx.staff);

function rangeBar(idPrefix, r) {

function bindRangeBar(idPrefix, r, load) {
  const t = todayYmd();

    r.from = f;
    r.to = to;

  };
  $('#' + idPrefix + 'Go').onclick = run;
  $('#' + idPrefix + 'Today').onclick = () => {
    $('#' + idPrefix + 'From').value = t;

/* ---------------- เรียงตารางด้วยการกดหัวคอลัมน์ ---------------- */
// สถานะการเรียงต่อตาราง (จำไว้ตลอด session): { k: คีย์, d: 'asc' | 'desc' }
S.sort = S.sort || {};
function sortState(name, k, d) {
  if (!S.sort[name]) S.sort[name] = { k: k || null, d: d || 'asc' };
  return S.sort[name];
}
function cmpVal(x, y) {
  const nx = x == null || x === '', ny = y == null || y === '';
  if (nx && ny) return 0;
  if (nx) return 1;
  if (ny) return -1;
  if (typeof x === 'number' && typeof y === 'number') return x - y;
  if (typeof x === 'boolean' || typeof y === 'boolean') return (x ? 1 : 0) - (y ? 1 : 0);
  return String(x).localeCompare(String(y), 'th', { numeric: true });
}
// sorted(rows, st, defaultCmp): ถ้ายังไม่กดหัวคอลัมน์ ใช้ลำดับเริ่มต้นของตาราง
function sorted(rows, st, defaultCmp) {
  const out = rows.slice();
  if (!st.k) return defaultCmp ? out.sort(defaultCmp) : out;
  const m = st.d === 'desc' ? -1 : 1;
  return out.sort((a, b) => cmpVal(a[st.k], b[st.k]) * m || (defaultCmp ? defaultCmp(a, b) : 0));
}
// ทำให้ th ที่มี data-k กดเรียงได้ (data-d = ทิศทางแรกเมื่อกด, ค่าเริ่มต้น asc)
function makeSortable(box, st, redraw) {
  $$('th[data-k]', box).forEach(th => {
    th.classList.add('sortable');
    th.classList.toggle('asc', st.k === th.dataset.k && st.d === 'asc');
    th.classList.toggle('desc', st.k === th.dataset.k && st.d === 'desc');
    th.title = 'กดเพื่อเรียงตามคอลัมน์นี้';
    th.onclick = () => {
      if (st.k === th.dataset.k) st.d = st.d === 'asc' ? 'desc' : 'asc';
      else { st.k = th.dataset.k; st.d = th.dataset.d || 'asc'; }
      redraw();
    };
  });
}

}

function calcSaleLine(ln, pmap, pools) {
  const r = { valid: false, p: null, unit: null, qty: 0, baseQty: 0, total: 0, cost: 0, profit: 0, alloc: [], error: '' };
  if (!ln.productId) return r;
  const p = pmap[ln.productId];
  if (!p) { r.error = 'ไม่พบสินค้านี้ (อาจถูกปิดใช้งาน) — กรุณาลบรายการ'; return r; }
  r.p = p;
  const unit = unitOf(p, ln.unitName);
  r.unit = unit;
  const q = Number(ln.qty);
  if (ln.qty === '' || !Number.isInteger(q) || q <= 0) { r.error = 'จำนวนต้องเป็นจำนวนเต็มมากกว่า 0'; return r; }
  const baseQty = q * unit.factor;
  const pool = pools[p.id] || (pools[p.id] = p.lots.map(l => Object.assign({}, l)));
  const avail = pool.reduce((s, l) => s + l.remaining, 0);
  if (avail < baseQty) {
    r.error = `คงเหลือไม่พอ (ต้องใช้ ${nf(baseQty)} เหลือ ${nf(avail)} ${unitsOf(p)[0].name})`;
    return r;
  }
  let need = baseQty;
  for (const l of pool) {
    if (need <= 0) break;
    if (l.remaining <= 0) continue;
    const t = Math.min(l.remaining, need);
    l.remaining -= t;
    need -= t;
    r.alloc.push({ lotId: l.lotId, qty: t, cost: l.cost });
  }
  r.valid = true;
  r.qty = q;
  r.baseQty = baseQty;
  r.total = r2(unit.price * q);
  r.cost = r2(r.alloc.reduce((s, a) => s + a.qty * a.cost, 0));
  r.profit = r2(r.total - r.cost);
  return r;
}

function calcSale() {
  if (!S.sale) return;
  const pmap = {};
  S.saleProducts.forEach(p => { pmap[p.id] = p; });
  const pools = {};
  const sum = { total: 0, cost: 0, profit: 0, count: 0, pieces: 0 };
  let ok = true;
  S.sale.lines.forEach(ln => {
    const r = calcSaleLine(ln, pmap, pools);
    if (ln.productId) {
      sum.count++;
      if (!r.valid) ok = false;
      else { sum.total += r.total; sum.cost += r.cost; sum.pieces += r.baseQty; }
    }
    const row = $(`#saleLines .line[data-k="${ln.k}"]`);
    if (!row) return;
    const out = n => row.querySelector(`[data-o="${n}"]`);
    out('price').textContent = r.unit ? money(r.unit.price) : '–';
    out('total').textContent = r.valid ? money(r.total) : '–';
    const al = row.querySelector('.alloc');
    al.className = 'alloc' + (r.error ? ' err' : '');
    al.innerHTML = r.error ? esc(r.error)
      : (r.unit && r.unit.factor > 1 ? `= ${nf(r.baseQty)} ${esc(unitsOf(r.p)[0].name)}<br>` : '') +
        r.alloc.map(a => `<span class="lot-tag">${esc(a.lotId)}</span> ×${nf(a.qty)}` +
          (S.perms.cost && a.cost != null ? ` @${money(a.cost)}` : '')).join('<br>');
  });
  sum.total = r2(sum.total);
  sum.cost = r2(sum.cost);
  sum.profit = r2(sum.total - sum.cost);
  S.sale.sum = sum;
  S.sale.ok = ok && sum.count > 0;
  if (!$('#stTotal')) return;
  $('#stCount').textContent = nf(sum.count);
  $('#stPieces').textContent = nf(sum.pieces);
  if ($('#stCost')) {
    $('#stCost').textContent = money(sum.cost);
    const sp = $('#stProfit');
    sp.textContent = money(sum.profit);
    sp.className = sum.profit < 0 ? 'neg' : '';
  }
  $('#stTotal').textContent = money(sum.total);
  $('#paySale').disabled = !S.sale.ok;
}

function quickCash(t) {
  const out = [t];
  [20, 100, 500, 1000].forEach(n => {
    const v = Math.ceil(t / n) * n;
    if (v > t && out.indexOf(v) < 0) out.push(v);
  });
  return out;
}

function openPayment() {
  calcSale();
  if (!S.sale || !S.sale.ok) { toast('กรุณาตรวจสอบรายการสินค้าให้ถูกต้อง', true); return; }
  if (!S.sale.presenterId) { toast('กรุณาเลือกผู้เสนอขาย', true); $('#bPresenter').focus(); return; }
  const sum = S.sale.sum;
  const st = { wallet: 'CASH', cash: '', slip: null, busy: false };

  openModal({
    title: 'ชำระเงิน',
    body: `<div class="due"><span>ยอดที่ต้องชำระ</span><strong>${money(sum.total)}</strong>
        <span>${nf(sum.count)} รายการ · ${nf(sum.pieces)} หน่วยสต็อก</span></div>
      <div class="seg" id="paySeg">
        <button type="button" data-w="CASH">เงินสด</button>
        <button type="button" data-w="TRANSFER">เงินโอน</button>
      </div>
      <div id="payPane"></div>`,
    foot: `<button class="btn" data-x>ย้อนกลับ</button>
           <button class="btn primary lg" id="payOk" disabled>ยืนยันชำระเงิน</button>`
  });
  $$('#paySeg button').forEach(b => { b.onclick = () => { st.wallet = b.dataset.w; pane(); }; });
  $('#payOk').onclick = submit;
  pane();

  function valid() {
    if (st.wallet === 'TRANSFER') return true;
    return st.cash !== '' && isFinite(Number(st.cash)) && r2(st.cash) >= sum.total;
  }

  function refresh() {
    const box = $('#changeBox');
    if (box) {
      const c = st.cash === '' ? null : r2(Number(st.cash) - sum.total);
      box.classList.toggle('short', c !== null && c < 0);
      $('#changeLbl').textContent = c !== null && c < 0 ? 'ยังขาดอีก' : 'เงินทอน';
      $('#changeVal').textContent = c === null ? '–' : money(Math.abs(c));
    }
    const ok = $('#payOk');
    if (ok) {
      ok.disabled = st.busy || !valid();
      ok.textContent = st.busy ? 'กำลังบันทึก…' : 'ยืนยันชำระเงิน';
    }
  }

  function pane() {
    $$('#paySeg button').forEach(b => b.classList.toggle('on', b.dataset.w === st.wallet));
    const box = $('#payPane');
    if (st.wallet === 'CASH') {
      box.innerHTML = `<label class="field"><span>รับเงินมา (บาท)</span>
          <input id="cashIn" class="cash-input" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(st.cash)}"></label>
        <div class="quick">${quickCash(sum.total).map((v, i) =>
          `<button type="button" class="btn" data-v="${v}">${i === 0 ? 'พอดี' : '฿' + nf(v)}</button>`).join('')}</div>
        <div class="change-box" id="changeBox"><span id="changeLbl">เงินทอน</span><strong id="changeVal">–</strong></div>`;
      const inp = $('#cashIn');
      inp.oninput = () => { st.cash = inp.value; refresh(); };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
      $$('.quick .btn', box).forEach(b => {
        b.onclick = () => { inp.value = b.dataset.v; st.cash = b.dataset.v; refresh(); };
      });
      setTimeout(() => inp.focus(), 60);
    } else {
      box.innerHTML = `<label class="drop" id="slipDrop">
          <input type="file" accept="image/*" id="slipIn">
          <b>แนบรูปสลิปโอนเงิน</b>
          <span class="muted">แตะเพื่อเลือกรูป / ถ่ายภาพ หรือลากไฟล์มาวาง (ไม่บังคับ)</span>
        </label>
        <img id="slipPrev" class="slip-preview" alt="สลิปโอนเงิน" hidden>
        <div class="btn-row" id="slipTools" hidden style="justify-content:center;margin-top:10px">
          <button type="button" class="btn sm danger" id="slipDel">ลบรูปสลิป</button>
        </div>`;
      const fin = $('#slipIn');
      fin.onchange = () => { const f = fin.files[0]; fin.value = ''; if (f) takeSlip(f); };
      const drop = $('#slipDrop');
      drop.ondragover = e => e.preventDefault();
      drop.ondrop = e => {
        e.preventDefault();
        const f = e.dataTransfer && e.dataTransfer.files[0];
        if (f) takeSlip(f);
      };
      $('#slipDel').onclick = () => { st.slip = null; showSlip(); };
      showSlip();
    }
    refresh();
  }

  async function takeSlip(f) {
    try {
      const im = await compressImage(f);
      st.slip = { data: im.data, mimeType: im.mimeType };
      toast(`บีบอัดสลิปแล้ว ${fmtBytes(im.origBytes)} → ${fmtBytes(im.bytes)}`);
      showSlip();
    }
    catch (e) { toast(cleanErr(e), true); }
  }

  function showSlip() {
    const img = $('#slipPrev');
    if (!img) return;
    img.hidden = !st.slip;
    $('#slipTools').hidden = !st.slip;
    if (st.slip) img.src = st.slip.data; else img.removeAttribute('src');
  }

  async function submit() {
    if (st.busy || !valid()) return;
    st.busy = true;
    refresh();
    try {
      const b = S.sale;
      const d = await api('createSale', S.token, {
        customerName: b.customer,
        presenterId: b.presenterId,
        docType: b.docType,
        docDate: docDateValue(b),
        items: b.lines.filter(l => l.productId).map(l => ({
          productId: l.productId, qty: Number(l.qty),
          unit: l.unitName || unitOf(S.saleProducts.find(x => x.id === l.productId), '').name
        })),
        wallet: st.wallet,
        cashReceived: st.wallet === 'CASH' ? Number(st.cash) : null,
        slip: st.wallet === 'TRANSFER' ? st.slip : null
      });
      applySaleToStock(d);
      S.sale = null;
      markStale('saleList');
      closeModal();
      toast('บันทึกการขายเรียบร้อย ' + d.saleId);
      if (S.view === 'sale') renderSale($('#view'), S.seq);
      showSaleReceipt(d, true);
    } catch (e) {
      st.busy = false;
      refresh();
      fail(e);
      if (/คงเหลือไม่พอ|ไม่พบสินค้า/.test(e.message)) {
        loadCtx('sale', true).then(() => { if (S.sale && $('#saleLines')) drawSaleLines(); }).catch(() => {});
      }
    }
  }
}
